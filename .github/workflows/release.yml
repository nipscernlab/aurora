name: Release

# Builds the Windows installer and publishes it to the SAPHO distribution
# channel. Two repos, two roles:
#
#   nipscernlab/aurora , SOURCE. release-please keeps a release PR open here;
#                         merging it tags the commit and publishes a GitHub
#                         Release, which is what triggers this workflow.
#   nipscernlab/sapho  , DISTRIBUTION. The installer, `latest.yml` and the
#                         `.blockmap` land here. `main/updater.js` and
#                         `package.json#build.publish` both point at it, so
#                         this is the feed every installed copy polls.
#
# Because the two repos differ, the default GITHUB_TOKEN is NOT enough: it is
# scoped to `aurora` and gets `403 Resource not accessible by integration` when
# electron-builder POSTs to /repos/nipscernlab/sapho/releases. That is exactly
# how the 2026-05-19 run died, and why v6.3.2 had to be published by hand.
# The publish therefore uses SAPHO_RELEASE_TOKEN, a fine-grained PAT with
# `Contents: read and write` on nipscernlab/sapho, and the first step below
# fails fast, in seconds, if that secret is missing or lacks write access.
#
# The build needs the bundled SAPHO toolchain under `components/`, which is NOT
# committed to the source tree, `npm run bootstrap` downloads it: the unified
# mingw bundle (iverilog/yosys/verilator/python+cocotb) from the `msys-vN`
# Release, plus the gtkwave-nipscern fork, the YANC compilers, and Surfer from
# their own Releases. netlistsvg rides in via `npm ci` (in-process).

# O gatilho `release: published` NAO basta, e descobrir isso custou uma release.
# O release-please cria a Release com o GITHUB_TOKEN, e o GitHub deliberadamente
# nao dispara workflow a partir de evento criado por aquele token, para evitar
# recursao. Resultado: a Release aparecia e o instalador nunca era construido, e
# as versoes anteriores acabaram publicadas a mao.
#
# Por isso o `workflow_call`: o proprio release-please.yml chama este workflow
# quando acabou de criar uma Release. O gatilho `release` fica para o caso de
# alguem criar a Release a mao pela interface do GitHub, e o dispatch fica para
# o dry run.
on:
  release:
    types: [published]
  workflow_call:
    inputs:
      dry_run:
        description: 'Preflight only, build and publish nothing'
        type: boolean
        default: false
      sign_only:
        description: 'Build and sign, publish nothing'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preflight only — verify publish access, build and publish nothing'
        type: boolean
        default: false
      sign_only:
        description: 'Build and SIGN, publish nothing — for exercising the SignPath test certificate'
        type: boolean
        default: false

# Never let two publishes race onto the same distribution channel, a partial
# asset set on the release is what a client sees as a corrupt update.
concurrency:
  group: release-sapho
  cancel-in-progress: false

env:
  # Single source of truth for the distribution channel. Keep in sync with
  # package.json#build.publish and REPO_OWNER/REPO_NAME in main/updater.js.
  DIST_REPO: nipscernlab/sapho

jobs:
  # ── Fail fast ─────────────────────────────────────────────────────────────
  # A missing or underpowered token used to surface only after the ~20 min
  # build, at the very last step. Prove it in the first few seconds instead.
  # `workflow_dispatch` with dry_run stops here, so this doubles as a cheap
  # "is the release pipeline ready?" check that builds and publishes nothing.
  preflight:
    name: Preflight — publish access
    runs-on: ubuntu-latest
    # Somente a conta do dono publica. O bot cobre o caminho normal, em que a
    # release e criada pelo release-please, ja gated pelo mesmo ator no outro
    # workflow. Uma release criada a mao por outra conta para aqui, antes de
    # gastar os ~20 min de build. O job `release` herda via needs: preflight
    # pulado pula os dependentes.
    if: github.actor == 'Chrysthofer' || github.actor == 'github-actions[bot]'
    permissions: {}

    steps:
      - name: Verify publish access to the distribution repo
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SAPHO_RELEASE_TOKEN }}
        run: |
          if (-not $env:GH_TOKEN) {
            Write-Host "::error::Secret SAPHO_RELEASE_TOKEN is not set."
            Write-Host "::error::Create a fine-grained PAT with 'Contents: read and write' on $env:DIST_REPO,"
            Write-Host "::error::then add it under nipscernlab/aurora -> Settings -> Secrets and variables -> Actions."
            exit 1
          }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept        = 'application/vnd.github+json'
            'User-Agent'  = 'aurora-release-workflow'
          }
          try {
            $repo = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:DIST_REPO" -Headers $headers
          } catch {
            Write-Host "::error::SAPHO_RELEASE_TOKEN cannot read $env:DIST_REPO ($($_.Exception.Message))."
            Write-Host "::error::Check that the PAT lists that repository, is approved by the org, and has not expired."
            exit 1
          }
          if (-not $repo.permissions.push) {
            Write-Host "::error::SAPHO_RELEASE_TOKEN can read $env:DIST_REPO but cannot write to it."
            Write-Host "::error::The PAT needs the 'Contents: read and write' permission."
            exit 1
          }
          Write-Host "Publish access to $env:DIST_REPO confirmed."
          if ('${{ inputs.dry_run }}' -eq 'true') {
            Write-Host "Dry run: stopping here. Nothing was built or published."
          }

  release:
    name: Build & publish (windows-latest)
    runs-on: windows-latest
    needs: preflight
    # A dry run proves the token and stops; only a real release event (or a
    # dispatch with dry_run off) is allowed to touch the distribution channel.
    if: ${{ inputs.dry_run != true }}

    permissions:
      contents: read   # this job never writes to `aurora`; it publishes to DIST_REPO

    env:
      # Read by the step-level `if`s that pick the signed or the unsigned path.
      # An unset secret expands to the empty string, which is the whole switch.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}

    steps:
      # Trava contra a pior confusao que este desenho permite: publicar para os
      # alunos um instalador assinado com o certificado de TESTE.
      #
      # O certificado de teste e autoassinado, e um instalador assinado com ele
      # e PIOR do que um nao assinado: o Windows deixa de dizer apenas
      # "publicador desconhecido" e passa a dizer que a cadeia termina numa raiz
      # em que ele nao confia, que soa como adulteracao. Basta a variavel
      # SIGNPATH_POLICY_SLUG ficar em `test-signing` depois de um ensaio, e a
      # proxima release de verdade sai assim, sem ninguem perceber, porque o
      # fluxo teria feito tudo certo do ponto de vista dele.
      #
      # Primeiro passo do job de proposito: falha em segundos, e nao depois dos
      # vinte minutos de bootstrap e build.
      - name: Refuse to sign a real release with the test certificate
        if: ${{ env.SIGNPATH_API_TOKEN != '' && inputs.sign_only != true && vars.SIGNPATH_POLICY_SLUG == 'test-signing' }}
        shell: pwsh
        run: |
          Write-Host "::error::SIGNPATH_POLICY_SLUG esta em 'test-signing' e esta execucao PUBLICA. O certificado de teste e autoassinado e nao pode chegar a um aluno. Troque a variavel para a politica de producao, ou rode com sign_only marcado."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      # Mesma versao do ci.yml. O piso do projeto e 22.22.1 (lint-staged 17);
      # ver a nota la e o engines do package.json.
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap toolchain bundle
        # Downloads the unified msys bundle + gtkwave-nipscern + YANC compilers
        # + Surfer and copies components into place. Pulls from public Releases.
        run: npm run bootstrap

      - name: Verify toolchain sentinels
        # The downloaders exit 0 on failure (so a dev offline can still start the
        # IDE). A *release* must NOT ship without the toolchain, so fail loudly
        # if bootstrap left any component missing.
        #
        # The list used to live here, and it drifted: it named `surfer.exe`
        # while the fork's binary is `surfer-aurora.exe`, so this gate failed a
        # release for a file that was present under the name everything else in
        # the repo already used. The script asks each downloader where its
        # binary lands, so renaming one cannot desynchronise this again.
        run: node scripts/verify-toolchain-sentinels.js

      # The toolchain is on disk at this point and nowhere else in CI, so this
      # is the one opportunity to prove it actually works before we ship it.
      # Compiles a real C± processor, elaborates it, simulates it, and decodes
      # the dump, using the same argument builders the app calls. A release
      # whose compiler pipeline is broken must never reach a lab machine.
      - name: Toolchain integration (C± -> Verilog -> simulation)
        run: npm run test:toolchain

      - name: Build main/preload (tsc)
        # electron-builder runs directly below (not via `npm run build`), so the
        # `prebuild` hook (bootstrap && build:ts && build:renderer) does NOT fire.
        # Compile the in-place .ts -> .js so a release cut from a commit whose .js
        # is out of sync with its .ts still ships fresh main/preload logic.
        run: npm run build:ts

      - name: Build renderer (Vite)
        # Bundles the renderer into dist/. Same reason as above, without this the
        # package would ship a stale/absent dist and fall back to the raw
        # index.html inside the asar.
        run: npm run build:renderer

      # ── Signing ───────────────────────────────────────────────────────────
      # Two paths below, picked by whether SIGNPATH_API_TOKEN exists. Until that
      # secret is created the first path runs and behaves exactly as before, so
      # committing this changes nothing about today's releases.
      #
      # Signing is deliberately NOT a hard gate. SignPath disclaims availability
      # (ToS §9/§10) and can revoke a certificate, so a missing or dead
      # credential degrades to an unsigned build instead of blocking an urgent
      # fix. The unsigned install path in TODO.md section 2 stays valid forever.
      #
      # Os nomes dos inputs abaixo foram conferidos em 22/08/2026 contra o
      # action.yml publicado da action (branch main): `api-token`,
      # `organization-id`, `project-slug`, `signing-policy-slug`,
      # `github-artifact-id`, `wait-for-completion`, `output-artifact-directory`
      # e `wait-for-completion-timeout-in-seconds` existem e estao escritos
      # assim. Ha um `artifact-configuration-slug` OPCIONAL, que so e preciso
      # quando o projeto tem mais de uma Artifact Configuration; com uma so,
      # deixar de fora e o correto.
      #
      # Falta criar o secret e as tres `vars` (SIGNPATH_ORG_ID,
      # SIGNPATH_PROJECT_SLUG, SIGNPATH_POLICY_SLUG) no painel. TODO.md secao 3
      # lista o que precisa ser decidido la primeiro.
      # Always `--publish never`. electron-builder's own GitHub publisher used to
      # do the upload, and it is the wrong tool for a CROSS-repo release: it
      # half-published 6.4.0, putting the 550 MB installer on the release and
      # then dying with "Published releases must have a valid tag" before
      # `latest.yml` and the `.blockmap` went up. An installer without
      # `latest.yml` is worse than no release at all, every client polls that
      # file, so the channel looks alive and updates nothing. It is very likely
      # the same reason v6.3.2 had to be published by hand.
      #
      # `--publish never` still writes `latest.yml` and the `.blockmap`: for an
      # NSIS target electron-builder sets `isWriteUpdateInfo` regardless of the
      # publish policy, so only the upload is ours to do. Doing it explicitly
      # below also means the signed and unsigned paths publish through the same
      # step, instead of two publishers that can disagree.
      - name: Build installer
        run: npx electron-builder --win --x64 --publish never

      - name: Upload the unsigned installer for SignPath
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        id: upload-unsigned
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: release/sapho-aurora-Setup-*.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORG_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist-signed
          # Uma hora, e nao os 600 s padrao da action.
          #
          # O programa gratuito da Foundation exige um Approver HUMANO por
          # requisicao de assinatura (ToS 2.3). Com o padrao, o passo desiste
          # depois de dez minutos, e uma release feita fora do horario de quem
          # aprova falharia sozinha, deixando a tag publicada sem instalador.
          # Uma hora e folgado para alguem receber a notificacao e clicar, e
          # nao custa nada quando a aprovacao e automatica.
          wait-for-completion-timeout-in-seconds: '3600'

      # The signed .exe goes back where electron-builder left the unsigned one,
      # then latest.yml (sha512 + size) and the .blockmap are rebuilt from it.
      # Skipping the blockmap rebuild would not break the update, it would make
      # every signed release a full ~500 MB download for the whole lab, and the
      # integrity gate below would then fail on the missing asset.
      - name: Swap in the signed installer and refresh the update manifest
        if: ${{ env.SIGNPATH_API_TOKEN != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = Get-ChildItem dist-signed -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $signed) {
            Write-Host "::error::SignPath returned no .exe in dist-signed."
            exit 1
          }
          Copy-Item $signed.FullName (Join-Path 'release' $signed.Name) -Force
          node scripts/patch-latest-yml.js release $signed.Name

      # Ensaio da assinatura: construiu, assinou, e para aqui.
      #
      # O certificado de TESTE da SignPath e autoassinado, entao o instalador
      # que ele produz NAO pode ir para o canal de distribuicao: um cliente que
      # o baixasse veria um publicador em que a maquina dele nao confia, que e
      # pior do que o nao assinado de hoje. O que se quer deste modo e provar o
      # caminho, credencial, Artifact Configuration, politica e a troca do
      # instalador com o manifesto refeito, sem tocar em ninguem la fora.
      #
      # O .exe assinado sai como anexo da execucao, para ser baixado e conferido
      # com `signtool verify /pa` e com o `Get-AuthenticodeSignature` do
      # PowerShell. Com o certificado de teste, os dois devem dizer que a
      # assinatura existe e que a cadeia nao e confiavel; e esse o resultado
      # certo, e nao um erro.
      - name: Upload the signed installer for inspection (sign_only)
        if: ${{ inputs.sign_only == true }}
        uses: actions/upload-artifact@v7
        with:
          name: signed-installer
          path: |
            release/sapho-aurora-Setup-*.exe
            release/sapho-aurora-Setup-*.exe.blockmap
            release/latest.yml
          if-no-files-found: error

      # The single publish path, signed or not. Uploading all three assets in
      # one command is deliberate: the updater needs `latest.yml` to see the
      # release at all and the `.blockmap` to download only what changed, so
      # partial success is the failure mode worth designing against.
      - name: Publish to the distribution channel
        if: ${{ inputs.sign_only != true }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SAPHO_RELEASE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag     = "v$version"
          $exe     = "sapho-aurora-Setup-v$version.exe"

          $assets = @(
            (Join-Path 'release' $exe),
            (Join-Path 'release' "$exe.blockmap"),
            (Join-Path 'release' 'latest.yml')
          )
          $absent = $assets | Where-Object { -not (Test-Path $_) }
          if ($absent) {
            Write-Host "::error::The build did not produce: $($absent -join ', ')"
            exit 1
          }

          # The release may already exist: release-please creates one on THIS
          # repo, but the distribution channel is a different repo, so it has
          # to be created there. A re-run after a failed publish finds it and
          # just replaces the assets. The body is filled in by the mirror step.
          gh release view $tag --repo $env:DIST_REPO *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:DIST_REPO --title "SAPHO $tag" --notes "SAPHO $tag"
          }
          gh release upload $tag $assets --repo $env:DIST_REPO --clobber
          Write-Host "Published $tag to $env:DIST_REPO: $($assets.Count) assets."

      # ── Post-publish integrity gate ─────────────────────────────────────
      # Everything an installed copy does on update is driven by `latest.yml`:
      # it names the installer and carries the sha512 the client verifies before
      # running it. If that file and the uploaded .exe ever disagree, EVERY
      # machine fails with "checksum mismatch" and the only fix is a new
      # release. So we re-download what the release actually serves and compare
      # it against the bytes we just built, from the outside, as a client would.
      - name: Verify the published update feed
        if: ${{ inputs.sign_only != true }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SAPHO_RELEASE_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag     = "v$version"
          $exeName = "sapho-aurora-Setup-v$version.exe"

          $localExe = Join-Path 'release' $exeName
          if (-not (Test-Path $localExe)) {
            Write-Host "::error::Local installer $localExe is missing — the build did not produce what we expect to publish."
            exit 1
          }
          $localSha = [Convert]::ToBase64String(
            [System.Security.Cryptography.SHA512]::Create().ComputeHash([IO.File]::ReadAllBytes($localExe)))
          $localSize = (Get-Item $localExe).Length

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept        = 'application/vnd.github+json'
            'User-Agent'  = 'aurora-release-workflow'
          }
          $rel = Invoke-RestMethod -Headers $headers `
            -Uri "https://api.github.com/repos/$env:DIST_REPO/releases/tags/$tag"

          # 1. Every asset the updater needs must be on the release. The
          #    .blockmap is what makes a delta download possible, without it
          #    each client re-downloads the whole installer.
          foreach ($needed in @($exeName, "$exeName.blockmap", 'latest.yml')) {
            if (-not ($rel.assets | Where-Object { $_.name -eq $needed })) {
              Write-Host "::error::Release $tag on $env:DIST_REPO is missing asset '$needed'."
              exit 1
            }
          }

          # 2. The published latest.yml must describe the published installer.
          #    Fetch it the way a client does, over plain HTTPS.
          #
          #    Download to a file rather than reading .Content: GitHub serves
          #    release assets as application/octet-stream, and for a non-text
          #    content type PowerShell hands back a byte[]. Regexing that
          #    stringifies the array to "118 101 114 …", every pattern misses,
          #    and the step reports an empty feed and three mismatches, which
          #    is what it did, against a latest.yml that was perfectly correct.
          $ymlUrl  = "https://github.com/$env:DIST_REPO/releases/download/$tag/latest.yml"
          $ymlFile = Join-Path $env:RUNNER_TEMP 'published-latest.yml'
          Invoke-WebRequest -Uri $ymlUrl -UseBasicParsing -OutFile $ymlFile
          $yml = Get-Content $ymlFile -Raw

          $ymlVersion = ([regex]::Match($yml, '(?m)^version:\s*(\S+)')).Groups[1].Value
          $ymlPath    = ([regex]::Match($yml, '(?m)^path:\s*(\S+)')).Groups[1].Value
          $ymlSha     = ([regex]::Match($yml, '(?m)^sha512:\s*(\S+)')).Groups[1].Value

          # Distinguish "the feed disagrees" from "the feed could not be read".
          # They need opposite responses, and reporting the second as the first
          # sends whoever is on call to delete a release that was fine.
          if (-not $ymlVersion -and -not $ymlPath -and -not $ymlSha) {
            Write-Host "::error::Could not parse the published latest.yml at $ymlUrl."
            Write-Host "::error::First 200 characters: $($yml.Substring(0, [Math]::Min(200, $yml.Length)))"
            exit 1
          }

          $problems = @()
          if ($ymlVersion -ne $version) { $problems += "version: feed says '$ymlVersion', package.json says '$version'" }
          if ($ymlPath    -ne $exeName) { $problems += "path: feed says '$ymlPath', built '$exeName'" }
          if ($ymlSha     -ne $localSha) { $problems += "sha512 does not match the installer we built" }
          if ($problems) {
            Write-Host "::error::The published update feed does not match the published installer:"
            $problems | ForEach-Object { Write-Host "::error::  - $_" }
            Write-Host "::error::Every client would fail this update with a checksum mismatch. Delete release $tag on $env:DIST_REPO and re-run."
            exit 1
          }

          Write-Host "Update feed verified: $tag -> $exeName ($([math]::Round($localSize/1MB,1)) MB), sha512 matches, blockmap present."

      # The release body lives on the `aurora` release (release-please writes the
      # changelog there). electron-builder creates the DIST_REPO release with an
      # empty body, so the update window, which reads release notes from
      # DIST_REPO via main/updater.js `fetchReleaseNotes`, would show a blank
      # changelog. Copy the notes across so users see what changed.
      #
      # This used to run only `if: github.event_name == 'release'`, reading the
      # body straight off the event payload, and that made it dead code. The
      # release is created by release-please using GITHUB_TOKEN, and GitHub does
      # not fire workflow triggers for events raised with that token, it is how
      # it stops workflows from setting each other off in a loop. So `on:
      # release: published` never fires here, this workflow is always started by
      # hand (which is what the README describes), the event was never 'release',
      # and the step never ran. Every published update would have shown an empty
      # changelog. Fetch the notes by tag instead, and let the payload be a
      # shortcut for the day the trigger does fire.
      - name: Mirror release notes to the distribution channel
        if: ${{ inputs.sign_only != true }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.SAPHO_RELEASE_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_NOTES: ${{ github.event.release.body }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = if ($env:EVENT_TAG) { $env:EVENT_TAG } else { "v$version" }

          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept        = 'application/vnd.github+json'
            'User-Agent'  = 'aurora-release-workflow'
          }

          $notes = $env:SOURCE_NOTES
          if (-not $notes) {
            try {
              $src = Invoke-RestMethod -Headers $headers `
                -Uri "https://api.github.com/repos/$env:SOURCE_REPO/releases/tags/$tag"
              $notes = $src.body
            } catch {
              Write-Host "::warning::Could not read release $tag on $env:SOURCE_REPO — $($_.Exception.Message)"
            }
          }
          if (-not $notes) {
            Write-Host "::warning::No release notes found for $tag. The update window will show an empty changelog."
            exit 0
          }

          $rel = Invoke-RestMethod -Headers $headers `
            -Uri "https://api.github.com/repos/$env:DIST_REPO/releases/tags/$tag"
          $body = @{ body = $notes; name = "SAPHO $tag" } | ConvertTo-Json
          Invoke-RestMethod -Method Patch -Headers $headers `
            -Uri "https://api.github.com/repos/$env:DIST_REPO/releases/$($rel.id)" `
            -ContentType 'application/json' -Body $body | Out-Null
          Write-Host "Release notes mirrored to $env:DIST_REPO $tag ($($notes.Length) chars)."
