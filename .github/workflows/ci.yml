name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint + smoke build (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 22, nao 20: o piso real do projeto e 22.22.1, imposto pelo
      # lint-staged 17. Antes disso o electron 43 pede 22.12, o commitlint 21
      # pede 22.12 e o claude-code pede 22. Rodar em 20 deixava o `npm ci`
      # cuspindo EBADENGINE em quatro pacotes e testava numa versao que o
      # projeto nao suporta. O piso esta declarado em package.json engines.
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned dependency versions
        run: node scripts/check-pinned-versions.js

      - name: ESLint
        run: npx eslint . --max-warnings=0

      - name: Typecheck (tsc --noEmit)
        run: npx tsc --noEmit

      - name: No generated .js committed (B4/B5 guard)
        run: node scripts/check-no-generated-js.js

      - name: i18n consistency (en/pt sync + no undefined keys)
        run: node scripts/check-i18n.js

      # A referencia das ferramentas da IA e gerada do TOOL_MANIFEST. Escrita a
      # mao, ela chegou a documentar 49 das 103, faltando funcionalidades
      # inteiras. Este check falha quando alguem acrescenta ou muda uma
      # ferramenta sem regerar.
      - name: AI tools reference is up to date
        run: node scripts/gen-ai-tools-doc.js --check

      - name: Dead code (unused files + dependencies)
        run: npm run deadcode

      - name: Sanity check JS modules
        shell: pwsh
        run: |
          Get-ChildItem -Path js,main -Recurse -Filter *.js |
            ForEach-Object { node --check $_.FullName }

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        # Uses the repo's CODECOV_TOKEN secret (GitHub → Settings → Secrets and
        # variables → Actions). Never fails CI — coverage is informational here.
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false


      - name: E2E tests (Electron smoke)
        run: npm run test:e2e

      - name: Build renderer (Vite)
        # electron-builder is invoked directly below (not via `npm run build`), so
        # the `prebuild` hook does NOT fire. Build the renderer explicitly so the
        # packaged smoke build validates the real Vite output (dist/) instead of a
        # stale/absent dist silently falling back to the raw index.html in the asar.
        run: npm run build:renderer

      - name: Build (no publish)
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
