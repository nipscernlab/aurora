<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="SAPHO" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>SAPHO — versao para tamanhos pequenos</title>
  <desc>Olho em torre de camaleao: escamas em espiral de filotaxia no angulo aureo, cada uma a celula de Voronoi do seu centro, crescendo do miolo para a borda. Cor da aurora boreal, verde no miolo passando por ciano e azul ate o violeta, escurecendo so no anel limbal externo. Fundo transparente; funciona em fundo claro e escuro. Versao reduzida a 20 escamas, para 16 e 20 px.</desc>
