<?xml version="1.0" encoding="UTF-8"?>
<!--
  PRISM custom skin: MUX (multiplexer)
  Covers: mux ($pmux, $mux, $_MUX_) and bus variant (mux-bus)
  Ports: A (input 0), B (input 1), S (select), Y (output)

  Visual: classic narrowing trapezoid — wide on input side, narrow
  on output side, with 0/1 labels indicating which input the select
  routes through.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:s="https://github.com/nturley/netlistsvg">

  <g s:type="mux" transform="translate(0, 0)" s:width="24" s:height="40">
    <s:alias val="$pmux"/>
    <s:alias val="$mux"/>
    <s:alias val="$_MUX_"/>

    <!-- Trapezoid -->
    <path d="M 0,0 L 24,10 L 24,30 L 0,40 Z"
          class="$cell_id"
          style="fill: var(--prism-module-fill, rgba(95,224,176,0.15));" />

    <!-- Input labels -->
    <text x="5" y="11" class="$cell_id" s:attribute=""
          style="text-anchor: start; font-size: 7px; font-weight: 700;
                 fill: var(--text, #ffffff); opacity: 0.7;">0</text>
    <text x="5" y="34" class="$cell_id" s:attribute=""
          style="text-anchor: start; font-size: 7px; font-weight: 700;
                 fill: var(--text, #ffffff); opacity: 0.7;">1</text>

    <!-- Port anchors -->
    <g s:x="0"  s:y="10" s:pid="A"/>
    <g s:x="0"  s:y="30" s:pid="B"/>
    <g s:x="12" s:y="35" s:pid="S"/>
    <g s:x="24" s:y="20" s:pid="Y"/>
  </g>

  <g s:type="mux-bus" transform="translate(0, 0)" s:width="28" s:height="40">
    <s:alias val="$pmux-bus"/>
    <s:alias val="$mux-bus"/>
    <s:alias val="$_MUX_-bus"/>

    <!-- Trapezoid + 2 trailing bus strokes -->
    <path d="M 0,0 L 24,10 L 24,30 L 0,40 Z"
          class="$cell_id"
          style="fill: var(--prism-module-fill, rgba(95,224,176,0.15));" />
    <path d="M 4,2 L 4,0 L 26,9 L 26,31 L 4,40 L 4,38 M 8,2 L 8,0 L 28,8 L 28,32 L 8,40 L 8,38"
          class="$cell_id"
          style="fill: none;
                 stroke: var(--prism-module-stroke, #5FE0B0);
                 stroke-width: 1;" />

    <text x="6" y="11" class="$cell_id" s:attribute=""
          style="text-anchor: start; font-size: 7px; font-weight: 700;
                 fill: var(--text, #ffffff); opacity: 0.7;">0</text>
    <text x="6" y="34" class="$cell_id" s:attribute=""
          style="text-anchor: start; font-size: 7px; font-weight: 700;
                 fill: var(--text, #ffffff); opacity: 0.7;">1</text>

    <g s:x="-1"   s:y="10" s:pid="A"/>
    <g s:x="-1"   s:y="30" s:pid="B"/>
    <g s:x="14"   s:y="38" s:pid="S"/>
    <g s:x="28.5" s:y="20" s:pid="Y"/>
  </g>

</svg>
