name: Release Please

# Generates a permanent "release PR" on `main` that aggregates every
# Conventional Commit since the last release. Merging that PR creates the
# version-bump commit, tags the release, and publishes the GitHub Release
# (which the existing release.yml workflow then builds + uploads the
# installer + latest.yml to).

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Somente a conta do dono cria releases. O job faz duas coisas: atualiza a
    # PR de release a cada push e, quando o push e o merge dela, cria a tag e
    # publica a Release. Travar pelo ator cobre as duas: um push de outro
    # colaborador nao atualiza a PR (o proximo push do dono atualiza), e um
    # merge da PR por outra conta nao vira release. A trava de verdade fica nas
    # configuracoes do GitHub (ruleset de tag); esta aqui e a do codigo.
    if: github.actor == 'Chrysthofer'
    # Consumido pelo job `build` abaixo.
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Pin to a major so unrelated changes upstream don't surprise us;
          # release-please-action follows semver, so we get patch + minor
          # automatically via dependabot.
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Acabou de sair uma Release? Entao constroi e publica o instalador.
  #
  # Isto existe porque o gatilho `release: published` do release.yml nunca
  # dispara para uma Release criada pelo GITHUB_TOKEN, que e o caso aqui. Chamar
  # o workflow diretamente e o caminho que nao depende de um PAT novo: `secrets:
  # inherit` passa o SAPHO_RELEASE_TOKEN adiante, que e o que publica no repo de
  # distribuicao.
  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/release.yml
    secrets: inherit
