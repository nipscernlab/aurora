<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAPHO — Update</title>
  <!-- Local fonts + shared brand palette (offline; single source of truth). -->
  <link rel="stylesheet" href="../css/base/fonts.css">
  <link rel="stylesheet" href="../css/base/brand_tokens.css">
  <style>
    :root {
      /* Superficies, texto e acentos vem de brand_tokens.css; os nomes abaixo
         sao apelidos locais para as regras ficarem legiveis. */
      --bg-0:      var(--bg);
      --bg-1:      var(--bg-elev);
      --bg-2:      var(--bg-elev-2);
      --bg-3:      var(--bg-elev-3);
      --text-soft: var(--text-secondary);
      --text-dim:  var(--text-muted);
      --teal:      var(--aurora-teal);
      --cyan:      var(--aurora-cyan);
      --danger:    var(--status-error);
      --border:    rgba(142,131,232,0.16);
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; overflow: hidden;
      background: transparent;
      font-family: var(--font-sans);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      user-select: none; -webkit-user-select: none;
    }

    /* ====== Caixa ======
       A caixa abraca o conteudo; a janela e que se ajusta a ela (o script no
       fim do arquivo mede e pede o redimensionamento ao main). */
    .window {
      position: relative;
      display: flex; flex-direction: column;
      border-radius: 14px; overflow: hidden;
      background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
      box-shadow:
        0 36px 80px rgba(0,0,0,0.7),
        inset 0 0 0 1px var(--border),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .window.shake { animation: shake 360ms ease; }

    /* O ceu da splash, o mesmo catalogo e o mesmo modulo. Fica atras de tudo
       e rareia para baixo, onde mora o texto; o degrade da caixa continua
       sendo o fundo de verdade, o canvas so poe as estrelas nele. */
    #stars {
      position: absolute; inset: 0; z-index: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 22%, rgba(0,0,0,0.35) 45%, transparent 66%);
      mask-image: linear-gradient(180deg, #000 0%, #000 22%, rgba(0,0,0,0.35) 45%, transparent 66%);
    }
    .topbar, .body { position: relative; z-index: 1; }

    /* ====== Topbar ====== */
    .topbar {
      -webkit-app-region: drag;
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px;
      flex-shrink: 0;
    }
    .topbar .brand {
      display: flex; align-items: center; gap: 9px;
      font-weight: 600; font-size: 12.5px; letter-spacing: 0.08em;
      color: var(--text-soft);
    }
    .topbar .brand img { width: 20px; height: 20px; }
    .topbar .spacer { flex: 1; }

    /* EN/PT sem moldura: dois rotulos, o ativo aceso. */
    .lang { -webkit-app-region: no-drag; display: inline-flex; gap: 2px; }
    .lang button {
      font-family: var(--font-sans);
      font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em;
      padding: 4px 7px; border: 0; border-radius: 6px;
      background: transparent; color: var(--text-dim);
      cursor: pointer; transition: color 160ms ease, background 160ms ease;
    }
    .lang button:hover { color: var(--text-soft); }
    .lang button.active { color: var(--text); background: rgba(255,255,255,0.07); }

    .close {
      -webkit-app-region: no-drag;
      width: 26px; height: 26px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: 0; border-radius: 7px;
      color: var(--text-dim);
      cursor: pointer; transition: all 160ms ease;
    }
    .close:hover { background: rgba(255,255,255,0.08); color: var(--text); }
    .close.locked { opacity: 0.35; pointer-events: none; }
    .close svg { width: 13px; height: 13px; }

    /* ====== Corpo ====== */
    .body {
      display: flex; flex-direction: column;
      padding: 18px 24px 22px;
    }
    .state { display: none; flex-direction: column; }
    .state.active { display: flex; animation: fade 240ms ease both; }

    /* Cabecalho de estado: titulo a esquerda e a linha de versao em mono
       logo abaixo, sem badge, sem seta colorida, sem gradiente no numero. */
    .head { flex-shrink: 0; padding-bottom: 14px; }
    .head h1 {
      font-size: 16px; font-weight: 650; letter-spacing: -0.01em;
    }
    .head .vline {
      margin-top: 6px;
      font-family: var(--font-mono); font-size: 11.5px;
      color: var(--text-dim);
    }
    .head .vline .to { color: var(--text-soft); }

    /* ---- changelog ---- */
    .changelog-label {
      display: flex; align-items: center; gap: 7px;
      font-size: 10.5px; font-weight: 600; letter-spacing: 0.10em;
      text-transform: uppercase; color: var(--text-dim);
      margin-bottom: 8px; flex-shrink: 0;
    }
    .changelog-label::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .changelog {
      /* Teto, e nao flex: o changelog e a unica parte que pode crescer sem
         limite, entao ele rola a partir daqui em vez de esticar a janela. */
      max-height: 300px; overflow-y: auto;
      padding: 2px 2px 2px 0;
      font-size: 12.5px; line-height: 1.62; color: var(--text-soft);
    }
    .changelog::-webkit-scrollbar { width: 8px; }
    .changelog::-webkit-scrollbar-thumb {
      background: var(--bg-3); border-radius: 4px;
    }
    .changelog h2 {
      font-size: 12.5px; font-weight: 650; color: var(--text);
      margin: 14px 0 6px;
    }
    .changelog h2:first-child { margin-top: 0; }
    .changelog h3 {
      font-size: 12px; font-weight: 600; color: var(--text);
      margin: 12px 0 5px;
    }
    .changelog ul { list-style: none; margin: 6px 0; }
    .changelog li { position: relative; padding-left: 14px; margin: 4px 0; }
    .changelog li::before {
      content: ''; position: absolute; left: 1px; top: 8px;
      width: 4px; height: 4px; border-radius: 50%;
      background: var(--text-dim);
    }
    .changelog p { margin: 6px 0; }
    .changelog strong { color: var(--text); font-weight: 600; }
    .changelog code {
      font-family: var(--font-mono); font-size: 11px;
      background: var(--bg-3); padding: 1px 5px; border-radius: 4px;
      color: var(--cyan);
    }
    .changelog a { color: var(--cyan); text-decoration: none; }
    .changelog hr { border: 0; border-top: 1px solid var(--border); margin: 10px 0; }

    /* Falha de verificacao ou de download, depois de esgotadas as
       tentativas. Uma linha de texto, sem caixa vermelha. */
    .notice {
      margin-bottom: 12px;
      font-size: 12px; line-height: 1.5; color: var(--danger);
    }
    .notice[hidden] { display: none; }

    /* ---- acoes ---- */
    .actions {
      display: flex; gap: 10px; margin-top: 16px; flex-shrink: 0;
      justify-content: flex-end;
    }
    .btn {
      -webkit-app-region: no-drag;
      padding: 9px 18px;
      font-family: var(--font-sans); font-size: 12.5px; font-weight: 600;
      border: 1px solid transparent; border-radius: 9px;
      cursor: pointer; transition: all 160ms ease;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .btn.ghost { background: transparent; border-color: var(--border); color: var(--text-soft); }
    .btn.ghost:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .btn.primary { background: var(--teal); color: var(--bg); }
    .btn.primary:hover { filter: brightness(1.08); }

    /* ---- download ---- */
    .dl { display: flex; flex-direction: column; }
    .track {
      height: 3px; margin-top: 4px;
      background: var(--bg-3);
      border-radius: 999px;
      overflow: hidden;
    }
    .fill {
      height: 100%; width: 0%;
      border-radius: 999px;
      background: var(--teal);
      transition: width 320ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    /* Uma linha de leitura, nao tres cartoes: proporcao, ritmo e estimativa. */
    .dl-line {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-top: 9px;
      font-family: var(--font-mono); font-size: 11.5px;
      color: var(--text-soft); font-variant-numeric: tabular-nums;
    }
    .dl-line .pct { color: var(--text); font-weight: 600; font-size: 13px; }
    /* Aviso de reconexao, visivel so enquanto o main tenta de novo sozinho.
       Sem ele a barra congela sem explicacao. */
    .retry-note {
      margin-top: 12px;
      font-size: 11.5px; color: var(--text-soft);
      font-variant-numeric: tabular-nums;
    }
    .retry-note[hidden] { display: none; }

    /* ---- pronto ---- */
    .done p {
      font-size: 12.5px; line-height: 1.62; color: var(--text-soft);
      max-width: 400px;
    }

    @keyframes fade  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-7px); }
      40%,80% { transform: translateX(7px); }
    }
  </style>
</head>
<body>
  <div class="window" id="window">
    <canvas id="stars"></canvas>

    <!-- ====== Topbar ====== -->
    <div class="topbar">
      <div class="brand">
        <img src="../assets/icons/sapho_aurora_icon.svg" alt="">
        <span>SAPHO</span>
      </div>
      <div class="spacer"></div>
      <div class="lang">
        <button id="lang-en" data-lang="en">EN</button>
        <button id="lang-pt" data-lang="pt">PT</button>
      </div>
      <button class="close" id="close" title="Later">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="body">

      <!-- ============ ESTADO: DISPONIVEL ============ -->
      <div class="state active" id="state-available">
        <div class="head">
          <h1 id="t-av-title">A new version is ready</h1>
          <div class="vline">
            <span id="v-from">v0.0.0</span>
            <span>&rarr;</span>
            <span class="to" id="v-to">v0.0.0</span>
            <span id="v-size"></span>
          </div>
        </div>

        <p class="notice" id="err-note" hidden></p>

        <div class="changelog-label" id="t-whatsnew">What changed</div>
        <div class="changelog" id="changelog"></div>

        <div class="actions">
          <button class="btn ghost" id="btn-later">
            <span id="t-later">Not now</span>
          </button>
          <button class="btn primary" id="btn-download">
            <span id="t-download">Download</span>
          </button>
        </div>
      </div>

      <!-- ============ ESTADO: BAIXANDO ============ -->
      <div class="state" id="state-downloading">
        <div class="head">
          <h1 id="t-dl-title">Downloading</h1>
          <div class="vline"><span class="to" id="dl-version">v0.0.0</span></div>
        </div>
        <div class="dl">
          <div class="track"><div class="fill" id="dl-fill"></div></div>
          <div class="dl-line">
            <span id="dl-transferred">0 / 0 MB</span>
            <span id="dl-speed"></span>
            <span id="dl-eta"></span>
            <span class="pct" id="dl-pct">0%</span>
          </div>
          <div class="retry-note" id="dl-retry" hidden></div>
        </div>
      </div>

      <!-- ============ ESTADO: PRONTO ============ -->
      <div class="state" id="state-done">
        <div class="head">
          <h1 id="t-dn-title">Downloaded</h1>
          <div class="vline"><span class="to" id="dn-version">v0.0.0</span></div>
        </div>
        <div class="done">
          <p id="t-dn-sub">Restart now to open on the new version, or keep working: it installs by itself the next time SAPHO opens.</p>
        </div>
        <div class="actions">
          <button class="btn ghost" id="btn-later2">
            <span id="t-later2">Keep working</span>
          </button>
          <button class="btn primary" id="btn-install">
            <span id="t-install">Restart now</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <script>
    // ============================================================
    //  i18n da janela (independente do i18n principal)
    // ============================================================
    const UI = {
      en: {
        avTitle: (v) => `Version ${v} is ready`,
        whatsNew: 'What changed',
        later: 'Not now', download: 'Download',
        dlTitle: 'Downloading',
        dnTitle: 'Downloaded',
        dnSub: 'Restart now to open on the new version, or keep working: it installs by itself the next time SAPHO opens.',
        later2: 'Keep working', install: 'Restart now',
        calc: 'estimating', noNotes: 'No release notes for this version.',
        eta: (t) => `${t} left`,
        secs: (s) => `${s}s`, mins: (m) => `${m} min`,
        retrying: (a, of, s) =>
          `The connection dropped. Trying again in ${s}s, attempt ${a} of ${of}.`,
        resuming: 'Reconnecting',
      },
      pt: {
        avTitle: (v) => `A versão ${v} está pronta`,
        whatsNew: 'O que mudou',
        later: 'Agora não', download: 'Baixar',
        dlTitle: 'Baixando',
        dnTitle: 'Baixada',
        dnSub: 'Reinicie agora para abrir na versão nova, ou continue trabalhando: ela se instala sozinha na próxima vez que o SAPHO abrir.',
        later2: 'Continuar trabalhando', install: 'Reiniciar agora',
        calc: 'estimando', noNotes: 'Sem notas de versão para esta versão.',
        eta: (t) => `falta ${t}`,
        secs: (s) => `${s}s`, mins: (m) => `${m} min`,
        retrying: (a, of, s) =>
          `A conexão caiu. Tentando de novo em ${s}s, tentativa ${a} de ${of}.`,
        resuming: 'Reconectando',
      },
    };

    let locale = (() => {
      try {
        const v = localStorage.getItem('aurora-locale');
        if (v === 'en' || v === 'pt') return v;
        const legacy = localStorage.getItem('aurora-yanc-lang');
        if (legacy === 'en' || legacy === 'pt') return legacy;
      } catch (_) {}
      return 'pt';
    })();

    // payload do update guardado para re-render ao trocar idioma
    let payload = null;

    // ============================================================
    //  Renderer das release notes.
    //
    //  Suporta dois formatos, porque o conteúdo chega em dois caminhos
    //  diferentes do mesmo updater:
    //    - HTML — electron-updater (GitHub provider) lê o atom feed de
    //      releases, cujo `<content type="html">` já vem renderizado.
    //      Sem este caminho, as tags `<h2>`, `<ul>`, ... aparecem
    //      escapadas no painel (foi o bug que motivou a reescrita).
    //    - Markdown — fallback `fetchReleaseNotes()` em main/updater.js,
    //      que bate na API REST do GitHub e devolve `body` cru.
    // ============================================================
    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function inline(s) {
      return escapeHtml(s)
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    }
    function mdToHtml(md) {
      const lines = String(md || '').replace(/\r/g, '').split('\n');
      let html = '', inList = false;
      const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
      for (let raw of lines) {
        const line = raw.trim();
        if (!line) { closeList(); continue; }
        if (/^#{1,6}\s/.test(line)) {
          closeList();
          const level = line.match(/^#+/)[0].length;
          const txt = line.replace(/^#+\s/, '');
          html += level <= 2 ? `<h2>${inline(txt)}</h2>` : `<h3>${inline(txt)}</h3>`;
        } else if (/^[-*]\s+/.test(line)) {
          if (!inList) { html += '<ul>'; inList = true; }
          html += `<li>${inline(line.replace(/^[-*]\s+/, ''))}</li>`;
        } else if (/^(-{3,}|_{3,}|\*{3,})$/.test(line)) {
          closeList(); html += '<hr>';
        } else {
          closeList(); html += `<p>${inline(line)}</p>`;
        }
      }
      closeList();
      return html;
    }

    // Heurística: presença de uma tag de bloco real (`<p>`, `<h2>`, `<ul>` ...)
    // indica HTML — markdown não as produz literalmente. Tags inline como
    // `<br>` ou `<a>` ficam de fora propositalmente para não classificar
    // markdown com HTML embutido pontual como "HTML puro".
    function looksLikeHtml(s) {
      return /<(h[1-6]|ul|ol|li|p|pre|blockquote|div)[\s>]/i.test(s);
    }

    // Allowlist de tags que o CSS da janela estiliza. Tudo fora disso é
    // desempacotado (mantém o texto, descarta o invólucro) — assim
    // `<svg>`, `<img>`, anchors decorativos do GitHub e afins somem sem
    // deixar buracos. Atributos são removidos por padrão; só href em <a>
    // sobrevive, e ainda restrita a http/https.
    const ALLOWED_TAGS = {
      H1: 'h2', H2: 'h2', H3: 'h3', H4: 'h3', H5: 'h3', H6: 'h3',
      UL: 'ul', OL: 'ul', LI: 'li',
      P: 'p', PRE: 'p', BLOCKQUOTE: 'p',
      STRONG: 'strong', B: 'strong', EM: 'em', I: 'em',
      CODE: 'code', A: 'a', HR: 'hr', BR: 'br',
    };
    function cleanNode(src, out) {
      src.childNodes.forEach((node) => {
        if (node.nodeType === 3) {
          out.appendChild(document.createTextNode(node.textContent));
          return;
        }
        if (node.nodeType !== 1) return; // skip comments / others
        const tag = node.tagName;
        if (tag === 'SCRIPT' || tag === 'STYLE') return;
        const mapped = ALLOWED_TAGS[tag];
        if (!mapped) { cleanNode(node, out); return; } // unwrap
        const el = document.createElement(mapped);
        if (mapped === 'a') {
          const href = node.getAttribute('href') || '';
          if (/^https?:\/\//i.test(href)) el.setAttribute('href', href);
        }
        cleanNode(node, el);
        out.appendChild(el);
      });
    }
    function htmlToSafe(html) {
      // <template> parses sem executar scripts e sem disparar
      // requisições de recurso — o que torna o passo de saneamento
      // posterior puramente "DOM walk", sem side-effects.
      const tpl = document.createElement('template');
      tpl.innerHTML = String(html || '');
      const box = document.createElement('div');
      cleanNode(tpl.content, box);
      return box.innerHTML;
    }

    function renderNotes(raw) {
      const text = String(raw || '').trim();
      if (!text) return '';
      return looksLikeHtml(text) ? htmlToSafe(text) : mdToHtml(text);
    }

    // ============================================================
    //  Separa as notas bilíngues. Convenções suportadas, em ordem:
    //   1. marcadores  <!-- EN -->  …  <!-- PT -->
    //   2. cabeçalhos  ## English / ## Português (com ou sem emoji)
    //  Sem nenhuma das duas → mesmas notas para ambos os idiomas.
    // ============================================================
    function splitLangs(body) {
      const text = String(body || '').trim();
      if (!text) return { en: '', pt: '' };

      const enM = text.match(/<!--\s*EN\s*-->/i);
      const ptM = text.match(/<!--\s*PT\s*-->/i);
      if (enM && ptM) {
        const enStart = enM.index + enM[0].length;
        const ptStart = ptM.index + ptM[0].length;
        if (enM.index < ptM.index) {
          return {
            en: text.slice(enStart, ptM.index).trim(),
            pt: text.slice(ptStart).trim(),
          };
        }
        return {
          pt: text.slice(ptStart, enM.index).trim(),
          en: text.slice(enStart).trim(),
        };
      }

      // cabeçalhos de idioma
      const lines = text.split('\n');
      let enIdx = -1, ptIdx = -1;
      lines.forEach((l, i) => {
        if (/^#{1,6}\s/.test(l.trim())) {
          if (enIdx < 0 && /english/i.test(l)) enIdx = i;
          if (ptIdx < 0 && /portugu/i.test(l)) ptIdx = i;
        }
      });
      if (enIdx >= 0 && ptIdx >= 0) {
        const a = Math.min(enIdx, ptIdx), b = Math.max(enIdx, ptIdx);
        const first = lines.slice(a + 1, b).join('\n').trim();
        const second = lines.slice(b + 1).join('\n').trim();
        return enIdx < ptIdx ? { en: first, pt: second } : { pt: first, en: second };
      }

      return { en: text, pt: text };
    }

    // ============================================================
    //  Render
    // ============================================================
    const $ = (id) => document.getElementById(id);

    // Todo link do changelog (o commit de cada item) abre no navegador. O
    // main bloqueia a navegacao desta janela, entao sem este desvio o clique
    // simplesmente nao faria nada; e antes do bloqueio ele fazia pior, trazia
    // o github.com para dentro da janela transparente.
    document.addEventListener('click', (e) => {
      const a = e.target instanceof Element ? e.target.closest('a[href]') : null;
      if (!a) return;
      e.preventDefault();
      window.updateAPI?.openExternal?.(a.getAttribute('href'));
    });

    function applyLocale() {
      const T = UI[locale];
      document.documentElement.lang = locale;
      $('t-av-title').textContent = T.avTitle(payload ? 'v' + payload.newVersion : '');
      $('t-whatsnew').firstChild.textContent = T.whatsNew + ' ';
      $('t-later').textContent    = T.later;
      $('t-download').textContent = T.download;
      $('t-dl-title').textContent = T.dlTitle;
      $('t-dn-title').textContent = T.dnTitle;
      $('t-dn-sub').textContent   = T.dnSub;
      $('t-later2').textContent   = T.later2;
      $('t-install').textContent  = T.install;
      $('lang-en').classList.toggle('active', locale === 'en');
      $('lang-pt').classList.toggle('active', locale === 'pt');
      renderChangelog();
    }

    function renderChangelog() {
      if (!payload) return;
      const langs = splitLangs(payload.releaseNotes);
      const notes = langs[locale] || langs.en || langs.pt;
      $('changelog').innerHTML = notes
        ? renderNotes(notes)
        : `<p style="color:var(--text-dim)">${UI[locale].noNotes}</p>`;
      $('changelog').scrollTop = 0;
      // O changelog e a parte que mais muda de tamanho, entao a altura e
      // recalculada depois de ele ser pintado, e nao so ao trocar de estado.
      ajustarAltura();
    }

    /**
     * Pede que a janela fique do tamanho do conteudo.
     *
     * Depois do proximo quadro, e nao no ato: a troca de estado acabou de mexer
     * no DOM e a medida sairia do layout antigo. O `ceil` mais a margem cobrem o
     * arredondamento do zoom da tela, que de outro modo cortaria um fio do
     * ultimo pixel.
     */
    function ajustarAltura() {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        const caixa = document.querySelector('.window');
        if (!caixa) return;
        window.updateAPI?.resizeToContent?.(Math.ceil(caixa.getBoundingClientRect().height) + 2);
      }));
    }

    function showState(name) {
      ['available', 'downloading', 'done'].forEach((s) => {
        $('state-' + s).classList.toggle('active', s === name);
      });
      // trava o X durante o download
      $('close').classList.toggle('locked', name === 'downloading');
      ajustarAltura();
    }

    function fmtEta(sec) {
      const T = UI[locale];
      if (sec == null || !isFinite(sec) || sec <= 0) return T.calc;
      if (sec < 60) return T.eta(T.secs(Math.ceil(sec)));
      return T.eta(T.mins(Math.ceil(sec / 60)));
    }

    // ---- aviso de reconexao --------------------------------------------
    // O main tenta de novo sozinho quando o download cai; sem isto a janela
    // ficaria numa barra imovel, parecendo travada.
    let retryTimer = null;

    function clearRetryNotice() {
      if (retryTimer) { clearInterval(retryTimer); retryTimer = null; }
      const el = $('dl-retry');
      el.hidden = true;
      el.textContent = '';
    }

    function startRetryCountdown(attempt, ofAttempts, seconds) {
      if (retryTimer) clearInterval(retryTimer);
      const el = $('dl-retry');
      el.hidden = false;
      let left = Math.max(0, Number(seconds) || 0);
      const paint = () => {
        const T = UI[locale];
        el.textContent = left > 0
          ? T.retrying(attempt, ofAttempts, left)
          : T.resuming;
      };
      paint();
      retryTimer = setInterval(() => {
        left -= 1;
        if (left <= 0) { clearInterval(retryTimer); retryTimer = null; }
        paint();
      }, 1000);
      // Velocidade e estimativa ficam velhas no instante em que a
      // transferencia para.
      $('dl-speed').textContent = '';
      $('dl-eta').textContent   = '';
    }

    // ============================================================
    //  IPC
    // ============================================================
    if (window.updateAPI) {
      window.updateAPI.onState((data) => {
        payload = data;
        if (data.state === 'available') {
          $('v-from').textContent = 'v' + data.currentVersion;
          $('v-to').textContent   = 'v' + data.newVersion;
          $('v-size').textContent = data.sizeMB ? `· ${data.sizeMB} MB` : '';
          $('dl-version').textContent = 'v' + data.newVersion;
          $('dn-version').textContent = 'v' + data.newVersion;
          showState('available');
        } else if (data.state === 'downloaded') {
          $('dn-version').textContent = 'v' + data.newVersion;
          showState('done');
        }
        applyLocale();
      });

      window.updateAPI.onProgress((p) => {
        showState('downloading');
        // Bytes correndo de novo: some o aviso de reconexao que sobrou.
        clearRetryNotice();
        $('dl-pct').textContent  = Math.round(p.percent) + '%';
        $('dl-fill').style.width = p.percent + '%';
        $('dl-transferred').textContent = `${p.transferredMB} / ${p.totalMB} MB`;
        $('dl-speed').textContent = `${p.speedMBs} MB/s`;
        $('dl-eta').textContent   = fmtEta(p.etaSec);
      });

      // O download caiu e o main vai tentar de novo. A contagem faz a barra
      // parada ler como recuperacao, e nao como travamento.
      window.updateAPI.onRetrying((r) => {
        showState('downloading');
        startRetryCountdown(r.attempt, r.ofAttempts, r.inSeconds);
      });

      window.updateAPI.onError((e) => {
        clearRetryNotice();
        const nota = $('err-note');
        nota.textContent = e.message || 'Update error';
        nota.hidden = false;
        showState('available');
      });

      window.updateAPI.onShake(() => {
        const w = $('window');
        w.classList.remove('shake');
        void w.offsetWidth;
        w.classList.add('shake');
      });
    }

    // ============================================================
    //  Eventos de UI
    // ============================================================
    $('lang-en').onclick = () => { locale = 'en'; persistLocale(); applyLocale(); };
    $('lang-pt').onclick = () => { locale = 'pt'; persistLocale(); applyLocale(); };
    function persistLocale() {
      try { localStorage.setItem('aurora-locale', locale); } catch (_) {}
    }

    $('btn-download').onclick = () => {
      $('err-note').hidden = true;
      window.updateAPI?.download();
      showState('downloading');
    };
    $('btn-install').onclick  = () => window.updateAPI?.install();
    $('btn-later').onclick    = () => window.updateAPI?.dismiss();
    $('btn-later2').onclick   = () => window.updateAPI?.dismiss();
    $('close').onclick        = () => window.updateAPI?.dismiss();

    applyLocale();
  </script>

  <!-- O ceu, do catalogo HYG, o mesmo modulo da splash. O catalogo entra
       embutido no bundle porque esta janela tambem abre por file://, onde
       fetch de caminho nao passa; js/ui/sky.js conta o resto. -->
  <script type="module">
    import { sky } from '../js/ui/sky.js';
    const ceu = document.getElementById('stars');
    if (ceu) sky(ceu);
  </script>
</body>
</html>
