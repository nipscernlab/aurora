<?xml version="1.0" encoding="UTF-8"?>
<!--
  PRISM custom skin: Bit-shift operators
  Covers: shl, shr, sshl, sshr ($shl, $shr, $sshl, $sshr)
  Ports: A (data), B (shift amount), Y (result)

  Visual: square block with directional arrows showing the shift
  direction (and "s" prefix for arithmetic / signed shifts).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:s="https://github.com/nturley/netlistsvg">

  <g s:type="shl" transform="translate(0, 0)" s:width="28" s:height="25">
    <s:alias val="$shl"/>
    <path d="M 0,0 L 28,0 L 28,25 L 0,25 Z"
          class="$cell_id"
          style="fill: var(--prism-module-fill, rgba(95,224,176,0.15));" />
    <text x="14" y="17" class="nodelabel $cell_id" s:attribute=""
          style="text-anchor: middle; font-weight: 700; font-size: 10px;
                 fill: var(--text, #ffffff);">&lt;&lt;</text>
    <g s:x="0"  s:y="6"    s:pid="A"/>
    <g s:x="0"  s:y="19"   s:pid="B"/>
    <g s:x="28" s:y="12.5" s:pid="Y"/>
  </g>

  <g s:type="shr" transform="translate(0, 0)" s:width="28" s:height="25">
    <s:alias val="$shr"/>
    <path d="M 0,0 L 28,0 L 28,25 L 0,25 Z"
          class="$cell_id"
          style="fill: var(--prism-module-fill, rgba(95,224,176,0.15));" />
    <text x="14" y="17" class="nodelabel $cell_id" s:attribute=""
          style="text-anchor: middle; font-weight: 700; font-size: 10px;
                 fill: var(--text, #ffffff);">&gt;&gt;</text>
    <g s:x="0"  s:y="6"    s:pid="A"/>
    <g s:x="0"  s:y="19"   s:pid="B"/>
    <g s:x="28" s:y="12.5" s:pid="Y"/>
  </g>

  <g s:type="sshl" transform="translate(0, 0)" s:width="32" s:height="25">
    <s:alias val="$sshl"/>
    <path d="M 0,0 L 32,0 L 32,25 L 0,25 Z"
          class="$cell_id"
          style="fill: var(--prism-module-fill, rgba(95,224,176,0.15));" />
    <text x="16" y="17" class="nodelabel $cell_id" s:attribute=""
          style="text-anchor: middle; font-weight: 700; font-size: 9px;
                 fill: var(--text, #ffffff);">s&lt;&lt;</text>
    <g s:x="0"  s:y="6"    s:pid="A"/>
    <g s:x="0"  s:y="19"   s:pid="B"/>
    <g s:x="32" s:y="12.5" s:pid="Y"/>
  </g>

  <g s:type="sshr" transform="translate(0, 0)" s:width="32" s:height="25">
    <s:alias val="$sshr"/>
    <path d="M 0,0 L 32,0 L 32,25 L 0,25 Z"
          class="$cell_id"
          style="fill: var(--prism-module-fill, rgba(95,224,176,0.15));" />
    <text x="16" y="17" class="nodelabel $cell_id" s:attribute=""
          style="text-anchor: middle; font-weight: 700; font-size: 9px;
                 fill: var(--text, #ffffff);">s&gt;&gt;</text>
    <g s:x="0"  s:y="6"    s:pid="A"/>
    <g s:x="0"  s:y="19"   s:pid="B"/>
    <g s:x="32" s:y="12.5" s:pid="Y"/>
  </g>

</svg>
