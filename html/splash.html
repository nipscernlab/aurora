<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAPHO — Initializing</title>
  <!-- Local fonts + shared brand palette (offline; single source of truth). -->
  <link rel="stylesheet" href="../css/base/fonts.css">
  <link rel="stylesheet" href="../css/base/brand_tokens.css">
  <style>
    :root {
      /* Surfaces, text and accents all come from brand_tokens.css, so the
         splash cannot drift from the window it hands over to. The two
         background tokens that used to sit here were declared and never read,
         and the text ramp was a shade off the app's for no reason anyone
         recorded. What is left are local aliases, which exist only to keep the
         rules below readable. */
      --text-soft:   var(--text-secondary);
      --text-dim:    var(--text-muted);
      --green:       var(--aurora-mint);
      --teal:        var(--aurora-teal);
      --cyan:        var(--aurora-cyan);
      --violet:      var(--aurora-violet);
      --purple:      var(--aurora-purple);
      --font-sans:   'Inter', system-ui, -apple-system, sans-serif;
      --font-mono:   'JetBrains Mono', ui-monospace, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: var(--font-sans);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      user-select: none; -webkit-user-select: none;
      cursor: default;
      -webkit-app-region: drag;
    }

    /* ============================================================
       Stage
       ============================================================ */
    .stage {
      position: fixed; inset: 0;
      display: grid;
      grid-template-rows: 1fr auto;
      border-radius: 18px;
      overflow: hidden;
      /* O céu de baixo é o mesmo do aplicativo, para a passagem do splash para
         a janela principal não ter degrau de brilho. Os dois brilhos radiais
         ficam locais de propósito: são a aurora desta tela, não superfície. */
      background:
        radial-gradient(ellipse 90% 70% at 50% 8%,  #0E2138 0%, transparent 60%),
        radial-gradient(ellipse 80% 60% at 50% 112%, #122A44 0%, transparent 55%),
        linear-gradient(180deg, var(--bg) 0%, var(--bg-elev) 55%, var(--bg) 100%);
      box-shadow:
        0 40px 90px rgba(0,0,0,0.7),
        inset 0 0 0 1px rgba(142,131,232,0.10),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }

    /* aurora SVG ribbons + starfield camadas de fundo */
    .aurora-svg, #stars {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }
    .aurora-svg { z-index: 0; }

    /* As estrelas rareiam para baixo, onde ficam o letreiro e a barra de
       progresso. O campo antigo fazia isso sorteando y só nos 78% de cima; o
       céu de verdade cobre a tela inteira, então quem afina é a máscara. */
    #stars {
      z-index: 1;
      -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 38%, rgba(0,0,0,0.55) 58%, rgba(0,0,0,0.20) 72%, transparent 84%);
      mask-image: linear-gradient(180deg, #000 0%, #000 38%, rgba(0,0,0,0.55) 58%, rgba(0,0,0,0.20) 72%, transparent 84%);
    }

    /* vinheta superior/inferior */
    .stage::after {
      content: ''; position: absolute; inset: 0; z-index: 2;
      pointer-events: none;
      background:
        radial-gradient(ellipse 120% 55% at 50% 0%,   rgba(0,0,0,0.55) 0%, transparent 55%),
        radial-gradient(ellipse 120% 45% at 50% 100%, rgba(0,0,0,0.45) 0%, transparent 60%);
    }

    /* ============================================================
       Conteúdo central
       ============================================================ */
    .content {
      position: relative; z-index: 3;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 22px; padding: 40px;
      text-align: center;
    }

    .mark {
      position: relative;
      width: 116px; height: 116px;
      display: flex; align-items: center; justify-content: center;
      animation: rise 700ms cubic-bezier(0.19,1,0.22,1) both;
    }
    .mark img {
      width: 116px; height: 116px;
      filter:
        drop-shadow(0 0 22px rgba(79,200,240,0.45))
        drop-shadow(0 0 46px rgba(142,131,232,0.30));
    }
    /* halo estático atrás do ícone */
    .mark::before {
      content: ''; position: absolute;
      width: 150%; height: 150%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(79,200,240,0.20) 0%, transparent 65%);
    }

    .wordmark {
      display: flex; align-items: baseline; justify-content: center;
      gap: 14px;
      animation: rise 700ms 90ms cubic-bezier(0.19,1,0.22,1) both;
    }
    .wordmark .sapho {
      font-size: 52px; font-weight: 800;
      letter-spacing: 0.14em;
      line-height: 1;
      background: linear-gradient(100deg,
        var(--green) 0%, var(--teal) 28%, var(--cyan) 52%,
        var(--violet) 78%, var(--purple) 100%);
      background-size: 220% 100%;
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shift 7s ease-in-out infinite;
    }
    .wordmark .amp {
      font-size: 22px; font-weight: 600;
      color: var(--text-dim);
    }
    .wordmark .aurora {
      font-size: 26px; font-weight: 600;
      letter-spacing: 0.30em;
      color: var(--text-soft);
    }

    .tagline {
      font-size: 11px; font-weight: 500;
      letter-spacing: 0.30em; text-transform: uppercase;
      color: var(--text-dim);
      animation: rise 700ms 180ms cubic-bezier(0.19,1,0.22,1) both;
    }

    /* ============================================================
       Rodapé — progresso real
       ============================================================ */
    .footer {
      position: relative; z-index: 3;
      padding: 0 36px 30px;
      display: flex; flex-direction: column; gap: 11px;
      animation: rise 700ms 260ms cubic-bezier(0.19,1,0.22,1) both;
    }

    .track {
      position: relative;
      width: 100%; height: 3px;
      background: rgba(142,131,232,0.12);
      border-radius: 3px; overflow: hidden;
    }
    .fill {
      position: absolute; inset: 0 auto 0 0;
      width: 0%;
      border-radius: 3px;
      background: linear-gradient(90deg,
        var(--green) 0%, var(--teal) 35%, var(--cyan) 65%, var(--violet) 100%);
      box-shadow: 0 0 12px rgba(79,200,240,0.55);
      transition: width 280ms cubic-bezier(0.4,0,0.2,1);
    }
    /* brilho que corre sobre a parte preenchida */
    .fill::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
      transform: translateX(-100%);
      animation: sheen 1.5s ease-in-out infinite;
    }

    .meta {
      display: flex; align-items: center; justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 10.5px; letter-spacing: 0.03em;
    }
    .meta-left { display: inline-flex; align-items: center; gap: 8px; }
    #phase { color: var(--text-soft); }
    .meta-right { display: inline-flex; align-items: center; gap: 9px; color: var(--text-dim); }
    #pct     { color: var(--text-soft); font-variant-numeric: tabular-nums; }
    #elapsed { font-variant-numeric: tabular-nums; }
    .sep { width: 2px; height: 2px; border-radius: 50%; background: var(--text-dim); }
    #version { color: var(--text-dim); }

    /* ============================================================
       Animações
       ============================================================ */
    @keyframes rise   { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes shift  { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes blink  { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.7); } }
    @keyframes sheen  { 0% { transform: translateX(-100%); } 60%,100% { transform: translateX(100%); } }
  </style>
</head>
<body>
  <div class="stage">

    <!-- ====== Aurora ribbons (SVG animado, inspirado no site NIPS-CERN) ====== -->
    <svg class="aurora-svg" xmlns="http://www.w3.org/2000/svg"
         viewBox="0 0 720 480" preserveAspectRatio="xMidYMid slice">
      <defs>
        <linearGradient id="rb1" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="rgba(0,0,0,0)"/>
          <stop offset="14%"  stop-color="rgba(69,224,160,0.55)"/>
          <stop offset="38%"  stop-color="rgba(47,217,195,0.80)"/>
          <stop offset="60%"  stop-color="rgba(79,200,240,0.72)"/>
          <stop offset="82%"  stop-color="rgba(142,131,232,0.50)"/>
          <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
        </linearGradient>
        <linearGradient id="rb2" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   stop-color="rgba(0,0,0,0)"/>
          <stop offset="22%"  stop-color="rgba(47,217,195,0.40)"/>
          <stop offset="50%"  stop-color="rgba(79,200,240,0.46)"/>
          <stop offset="76%"  stop-color="rgba(188,138,230,0.34)"/>
          <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
        </linearGradient>
        <linearGradient id="rays" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="rgba(69,224,160,0.28)"/>
          <stop offset="100%" stop-color="rgba(79,200,240,0)"/>
        </linearGradient>
        <filter id="bA" x="-5%" y="-220%" width="110%" height="540%"><feGaussianBlur stdDeviation="2 7"/></filter>
        <filter id="bB" x="-5%" y="-160%" width="110%" height="420%"><feGaussianBlur stdDeviation="5 11"/></filter>
        <filter id="bR" x="-5%" y="-10%"  width="110%" height="130%"><feGaussianBlur stdDeviation="9 18"/></filter>
      </defs>

      <!-- raios verticais sob a fita principal -->
      <path fill="url(#rays)" filter="url(#bR)" opacity="0.7">
        <animate attributeName="d" dur="20s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"
          values="
            M-90,96 C120,74 240,116 360,92 C480,68 600,104 810,86 L810,250 C600,266 480,236 360,256 C240,276 120,244 -90,262 Z;
            M-90,118 C120,98 240,138 360,114 C480,90 600,126 810,108 L810,272 C600,288 480,258 360,278 C240,298 120,266 -90,284 Z;
            M-90,96 C120,74 240,116 360,92 C480,68 600,104 810,86 L810,250 C600,266 480,236 360,256 C240,276 120,244 -90,262 Z"/>
      </path>

      <!-- fita principal -->
      <path fill="url(#rb1)" filter="url(#bA)" opacity="0.95">
        <animate attributeName="d" dur="20s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"
          values="
            M-90,94 C120,72 240,114 360,90 C480,66 600,102 810,84 L810,140 C600,156 480,126 360,146 C240,166 120,134 -90,152 Z;
            M-90,116 C120,96 240,136 360,112 C480,88 600,124 810,106 L810,162 C600,178 480,148 360,168 C240,188 120,156 -90,174 Z;
            M-90,94 C120,72 240,114 360,90 C480,66 600,102 810,84 L810,140 C600,156 480,126 360,146 C240,166 120,134 -90,152 Z"/>
      </path>

      <!-- fita secundária, mais baixa e suave -->
      <path fill="url(#rb2)" filter="url(#bB)" opacity="0.6">
        <animate attributeName="d" dur="27s" repeatCount="indefinite"
          calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"
          values="
            M-90,184 C120,168 240,196 360,176 C480,156 600,188 810,170 L810,214 C600,230 480,202 360,220 C240,238 120,214 -90,226 Z;
            M-90,168 C120,186 240,170 360,190 C480,210 600,176 810,196 L810,200 C600,214 480,196 360,204 C240,214 120,202 -90,212 Z;
            M-90,184 C120,168 240,196 360,176 C480,156 600,188 810,170 L810,214 C600,230 480,202 360,220 C240,238 120,214 -90,226 Z"/>
      </path>
    </svg>

    <!-- ====== Starfield + estrelas cadentes ====== -->
    <canvas id="stars"></canvas>

    <!-- ====== Conteúdo ====== -->
    <div class="content">
      <div class="mark">
        <img src="../assets/icons/sapho_aurora_icon.svg" alt="SAPHO">
      </div>
      <div class="wordmark">
        <span class="sapho">SAPHO</span>
        <span class="amp">&amp;</span>
        <span class="aurora">AURORA</span>
      </div>
      <p class="tagline" id="tagline">Scalable-Architecture Processor for Hardware Optimization</p>
    </div>

    <!-- ====== Rodapé com progresso real ====== -->
    <div class="footer">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="meta">
        <div class="meta-left">
          <span id="phase">Starting SAPHO</span>
        </div>
        <div class="meta-right">
          <span id="pct">0%</span>
          <span class="sep"></span>
          <span id="elapsed">0.0s</span>
          <span class="sep"></span>
          <span id="version">v—</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ============================================================
    //  i18n local — splash roda antes do i18n principal; lê o
    //  locale direto do localStorage e traz sua própria tabela.
    // ============================================================
    const STRINGS = {
      en: {
        tagline: 'Scalable-Architecture Processor for Hardware Optimization',
        boot: 'Starting SAPHO', window: 'Creating workspace',
        loading: 'Loading interface', dom: 'Building components',
        resources: 'Loading resources', editor: 'Initializing editor',
        ready: 'Ready',
      },
      pt: {
        tagline: 'Processador de Arquitetura Escalável para Otimização de Hardware',
        boot: 'Iniciando o SAPHO', window: 'Criando ambiente',
        loading: 'Carregando interface', dom: 'Montando componentes',
        resources: 'Carregando recursos', editor: 'Inicializando editor',
        ready: 'Pronto',
      },
    };
    const locale = (() => {
      try {
        const v = localStorage.getItem('aurora-locale');
        if (v === 'en' || v === 'pt') return v;
        const legacy = localStorage.getItem('aurora-yanc-lang');
        if (legacy === 'en' || legacy === 'pt') return legacy;
      } catch (_) {}
      return 'pt';
    })();
    const T = STRINGS[locale] || STRINGS.pt;
    document.getElementById('tagline').textContent = T.tagline;

    // ============================================================
    //  Progresso real — alimentado por main/windows.js via IPC.
    //  `target` é o último marco recebido; `shown` persegue o
    //  alvo suavemente para a barra nunca travar de forma seca.
    // ============================================================
    const fillEl    = document.getElementById('fill');
    const pctEl     = document.getElementById('pct');
    const phaseEl   = document.getElementById('phase');
    const elapsedEl = document.getElementById('elapsed');
    const versionEl = document.getElementById('version');

    const startedAt = performance.now();
    let target = 4, shown = 0, filled = false;

    (function ease() {
      // creep suave: aproxima `shown` de `target` sem ultrapassar
      shown += (target - shown) * 0.08;
      if (shown > 99.5 && target >= 100) shown = 100;
      fillEl.style.width = shown.toFixed(1) + '%';
      pctEl.textContent  = Math.round(shown) + '%';
      elapsedEl.textContent = ((performance.now() - startedAt) / 1000).toFixed(1) + 's';

      // a barra encheu de verdade — avisa o main, que aguarda 1s e
      // só então abre a interface principal.
      if (!filled && shown >= 100 && target >= 100) {
        filled = true;
        window.splashAPI?.notifyFilled?.();
      }
      requestAnimationFrame(ease);
    })();

    if (window.splashAPI) {
      window.splashAPI.onProgress(({ percent, phase }) => {
        if (typeof percent === 'number') target = Math.max(target, percent);
        if (phase && T[phase]) phaseEl.textContent = T[phase];
      });
      window.splashAPI.getAppVersion()
        .then((v) => { if (v) versionEl.textContent = v.startsWith('v') ? v : 'v' + v; })
        .catch(() => {});
    }
  </script>

  <!-- O céu, do catálogo HYG, em módulo à parte.
       Ele cresceu além do que cabe numa página, e o catálogo entra embutido no
       bundle porque a splash abre por file://, onde fetch de caminho não passa.
       js/ui/sky.js conta o resto. -->
  <script type="module">
    import { sky } from '../js/ui/sky.js';
    const c = document.getElementById('stars');
    if (c) sky(c);
  </script>
</body>
</html>
