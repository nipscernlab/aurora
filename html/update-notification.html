<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAPHO — Update</title>
  <!-- Local fonts + shared brand palette (offline; single source of truth). -->
  <link rel="stylesheet" href="../css/base/fonts.css">
  <link rel="stylesheet" href="../css/base/brand_tokens.css">
  <style>
    :root {
      /* Superficies, texto e acentos vem de brand_tokens.css; os nomes abaixo
         sao apelidos locais para as regras ficarem legiveis. */
      --bg-0:      var(--bg);
      --bg-1:      var(--bg-elev);
      --bg-2:      var(--bg-elev-2);
      --bg-3:      var(--bg-elev-3);
      --text-soft: var(--text-secondary);
      --text-dim:  var(--text-muted);
      --teal:      var(--aurora-teal);
      --cyan:      var(--aurora-cyan);
      --danger:    var(--status-error);
      --border:    rgba(142,131,232,0.16);
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw; overflow: hidden;
      background: transparent;
      font-family: var(--font-sans);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      user-select: none; -webkit-user-select: none;
    }

    /* ====== Caixa ======
       A caixa abraca o conteudo; a janela e que se ajusta a ela (o script no
       fim do arquivo mede e pede o redimensionamento ao main). */
    .window {
      position: relative;
      display: flex; flex-direction: column;
      border-radius: 14px; overflow: hidden;
      background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
      box-shadow:
        0 36px 80px rgba(0,0,0,0.7),
        inset 0 0 0 1px var(--border),
        inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .window.shake { animation: shake 360ms ease; }

    /* O ceu da splash, o mesmo catalogo e o mesmo modulo. Fica atras de tudo
       e rareia para baixo, onde mora o texto; o degrade da caixa continua
       sendo o fundo de verdade, o canvas so poe as estrelas nele. */
    #stars {
      position: absolute; inset: 0; z-index: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 22%, rgba(0,0,0,0.35) 45%, transparent 66%);
      mask-image: linear-gradient(180deg, #000 0%, #000 22%, rgba(0,0,0,0.35) 45%, transparent 66%);
    }
    .topbar, .body { position: relative; z-index: 1; }

    /* ====== Topbar ====== */
    .topbar {
      -webkit-app-region: drag;
      display: flex; align-items: center; gap: 10px;
      padding: 14px 16px;
      flex-shrink: 0;
    }
    .topbar .brand {
      display: flex; align-items: center; gap: 9px;
      font-weight: 600; font-size: 12.5px; letter-spacing: 0.08em;
      color: var(--text-soft);
    }
    .topbar .brand img { width: 20px; height: 20px; }
    .topbar .spacer { flex: 1; }

    /* EN/PT sem moldura: dois rotulos, o ativo aceso. */
    .lang { -webkit-app-region: no-drag; display: inline-flex; gap: 2px; }
    .lang button {
      font-family: var(--font-sans);
      font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em;
      padding: 4px 7px; border: 0; border-radius: 6px;
      background: transparent; color: var(--text-dim);
      cursor: pointer; transition: color 160ms ease, background 160ms ease;
    }
    .lang button:hover { color: var(--text-soft); }
    .lang button.active { color: var(--text); background: rgba(255,255,255,0.07); }

    .close {
      -webkit-app-region: no-drag;
      width: 26px; height: 26px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: 0; border-radius: 7px;
      color: var(--text-dim);
      cursor: pointer; transition: all 160ms ease;
    }
    .close:hover { background: rgba(255,255,255,0.08); color: var(--text); }
    .close.locked { opacity: 0.35; pointer-events: none; }
    .close svg { width: 13px; height: 13px; }

    /* ====== Corpo ====== */
    .body {
      display: flex; flex-direction: column;
      padding: 18px 24px 22px;
    }
    .state { display: none; flex-direction: column; }
    .state.active { display: flex; animation: fade 240ms ease both; }

    /* Cabecalho de estado: titulo a esquerda e a linha de versao em mono
       logo abaixo, sem badge, sem seta colorida, sem gradiente no numero. */
    .head { flex-shrink: 0; padding-bottom: 14px; }
    .head h1 {
      font-size: 16px; font-weight: 650; letter-spacing: -0.01em;
    }
    .head .vline {
      margin-top: 6px;
      font-family: var(--font-mono); font-size: 11.5px;
      color: var(--text-dim);
    }
    .head .vline .to { color: var(--text-soft); }

    /* ---- changelog ---- */
    .changelog-label {
      display: flex; align-items: center; gap: 7px;
      font-size: 10.5px; font-weight: 600; letter-spacing: 0.10em;
      text-transform: uppercase; color: var(--text-dim);
      margin-bottom: 8px; flex-shrink: 0;
    }
    .changelog-label::after {
      content: ''; flex: 1; height: 1px; background: var(--border);
    }
    .changelog {
      /* Teto, e nao flex: o changelog e a unica parte que pode crescer sem
         limite, entao ele rola a partir daqui em vez de esticar a janela. */
      max-height: 300px; overflow-y: auto;
      padding: 2px 2px 2px 0;
      font-size: 12.5px; line-height: 1.62; color: var(--text-soft);
    }
    .changelog::-webkit-scrollbar { width: 8px; }
    .changelog::-webkit-scrollbar-thumb {
      background: var(--bg-3); border-radius: 4px;
    }
    .changelog h2 {
      font-size: 12.5px; font-weight: 650; color: var(--text);
      margin: 14px 0 6px;
    }
    .changelog h2:first-child { margin-top: 0; }
    .changelog h3 {
      font-size: 12px; font-weight: 600; color: var(--text);
      margin: 12px 0 5px;
    }
    .changelog ul { list-style: none; margin: 6px 0; }
    .changelog li { position: relative; padding-left: 14px; margin: 4px 0; }
    .changelog li::before {
      content: ''; position: absolute; left: 1px; top: 8px;
      width: 4px; height: 4px; border-radius: 50%;
      background: var(--text-dim);
    }
    .changelog p { margin: 6px 0; }
    .changelog strong { color: var(--text); font-weight: 600; }
    .changelog code {
      font-family: var(--font-mono); font-size: 11px;
      background: var(--bg-3); padding: 1px 5px; border-radius: 4px;
      color: var(--cyan);
    }
    .changelog a { color: var(--cyan); text-decoration: none; }
    .changelog hr { border: 0; border-top: 1px solid var(--border); margin: 10px 0; }

    /* Falha de verificacao ou de download, depois de esgotadas as
       tentativas. Uma linha de texto, sem caixa vermelha. */
    .notice {
      margin-bottom: 12px;
      font-size: 12px; line-height: 1.5; color: var(--danger);
    }
    .notice[hidden] { display: none; }

    /* ---- acoes ---- */
    .actions {
      display: flex; gap: 10px; margin-top: 16px; flex-shrink: 0;
      justify-content: flex-end;
    }
    .btn {
      -webkit-app-region: no-drag;
      padding: 9px 18px;
      font-family: var(--font-sans); font-size: 12.5px; font-weight: 600;
      border: 1px solid transparent; border-radius: 9px;
      cursor: pointer; transition: all 160ms ease;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .btn.ghost { background: transparent; border-color: var(--border); color: var(--text-soft); }
    .btn.ghost:hover { background: rgba(255,255,255,0.05); color: var(--text); }
    .btn.primary { background: var(--teal); color: var(--bg); }
    .btn.primary:hover { filter: brightness(1.08); }

    /* ---- download ---- */
    .dl { display: flex; flex-direction: column; }
    .track {
      height: 3px; margin-top: 4px;
      background: var(--bg-3);
      border-radius: 999px;
      overflow: hidden;
    }
    .fill {
      height: 100%; width: 0%;
      border-radius: 999px;
      background: var(--teal);
      transition: width 320ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    /* Uma linha de leitura, nao tres cartoes: proporcao, ritmo e estimativa. */
    .dl-line {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-top: 9px;
      font-family: var(--font-mono); font-size: 11.5px;
      color: var(--text-soft); font-variant-numeric: tabular-nums;
    }
    .dl-line .pct { color: var(--text); font-weight: 600; font-size: 13px; }
    /* Aviso de reconexao, visivel so enquanto o main tenta de novo sozinho.
       Sem ele a barra congela sem explicacao. */
    .retry-note {
      margin-top: 12px;
      font-size: 11.5px; color: var(--text-soft);
      font-variant-numeric: tabular-nums;
    }
    .retry-note[hidden] { display: none; }

    /* ---- pronto ---- */
    .done p {
      font-size: 12.5px; line-height: 1.62; color: var(--text-soft);
      max-width: 400px;
    }

    @keyframes fade  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-7px); }
      40%,80% { transform: translateX(7px); }
    }
  </style>
</head>
<body>
  <div class="window" id="window">
    <canvas id="stars"></canvas>

    <!-- ====== Topbar ====== -->
    <div class="topbar">
      <div class="brand">
        <img src="../assets/icons/sapho_aurora_icon.svg" alt="">
        <span>SAPHO</span>
      </div>
      <div class="spacer"></div>
      <div class="lang">
        <button id="lang-en" data-lang="en">EN</button>
        <button id="lang-pt" data-lang="pt">PT</button>
      </div>
      <button class="close" id="close" title="Later">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <div class="body">

      <!-- ============ ESTADO: DISPONIVEL ============ -->
      <div class="state active" id="state-available">
        <div class="head">
          <h1 id="t-av-title">A new version is ready</h1>
          <div class="vline">
            <span id="v-from">v0.0.0</span>
            <span>&rarr;</span>
            <span class="to" id="v-to">v0.0.0</span>
            <span id="v-size"></span>
          </div>
        </div>

        <p class="notice" id="err-note" hidden></p>

        <div class="changelog-label" id="t-whatsnew">What changed</div>
        <div class="changelog" id="changelog"></div>

        <div class="actions">
          <button class="btn ghost" id="btn-later">
            <span id="t-later">Not now</span>
          </button>
          <button class="btn primary" id="btn-download">
            <span id="t-download">Download</span>
          </button>
        </div>
      </div>

      <!-- ============ ESTADO: BAIXANDO ============ -->
      <div class="state" id="state-downloading">
        <div class="head">
          <h1 id="t-dl-title">Downloading</h1>
          <div class="vline"><span class="to" id="dl-version">v0.0.0</span></div>
        </div>
        <div class="dl">
          <div class="track"><div class="fill" id="dl-fill"></div></div>
          <div class="dl-line">
            <span id="dl-transferred">0 / 0 MB</span>
            <span id="dl-speed"></span>
            <span id="dl-eta"></span>
            <span class="pct" id="dl-pct">0%</span>
          </div>
          <div class="retry-note" id="dl-retry" hidden></div>
        </div>
      </div>

      <!-- ============ ESTADO: PRONTO ============ -->
      <div class="state" id="state-done">
        <div class="head">
          <h1 id="t-dn-title">Downloaded</h1>
          <div class="vline"><span class="to" id="dn-version">v0.0.0</span></div>
        </div>
        <div class="done">
          <p id="t-dn-sub">Restart now to open on the new version, or keep working: it installs by itself the next time SAPHO opens.</p>
        </div>
        <div class="actions">
          <button class="btn ghost" id="btn-later2">
            <span id="t-later2">Keep working</span>
          </button>
          <button class="btn primary" id="btn-install">
            <span id="t-install">Restart now</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <script src="./update_boot.js"></script>

  <!-- O ceu, do catalogo HYG, o mesmo modulo da splash. O catalogo entra
       embutido no bundle porque esta janela tambem abre por file://, onde
       fetch de caminho nao passa; js/ui/sky.js conta o resto. -->
  <script src="./update_sky.js" type="module"></script>
</body>
</html>
