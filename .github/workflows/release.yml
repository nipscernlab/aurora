name: Release

# Builds the Windows installer and publishes it to a GitHub Release.
# The auto-updater (electron-updater) reads `latest.yml` + the .exe directly
# from these release assets — see `main/updater.js`.
#
# Trigger: fires automatically when a GitHub Release is *published* (the single
# flow — release-please opens the release PR; merging it publishes the release,
# which kicks off this build). `workflow_dispatch` stays as a manual fallback.
#
# The build needs the bundled SAPHO toolchain under `components/`, which is NOT
# committed to the source tree — `npm run bootstrap` downloads it: the unified
# mingw bundle (iverilog/yosys/verilator/python+cocotb) from the `msys-vN`
# Release, plus the gtkwave-nipscern fork, the YANC compilers, and Surfer from
# their own Releases. netlistsvg rides in via `npm ci` (in-process).

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release:
    name: Build & publish (windows-latest)
    runs-on: windows-latest

    permissions:
      contents: write   # needed to create the GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap toolchain bundle
        # Downloads the unified msys bundle + gtkwave-nipscern + YANC compilers
        # + Surfer and copies components into place. Pulls from public Releases.
        run: npm run bootstrap

      - name: Verify toolchain sentinels
        # The downloaders exit 0 on failure (so a dev offline can still start the
        # IDE). A *release* must NOT ship without the toolchain, so fail loudly
        # if bootstrap left any sentinel missing.
        shell: pwsh
        run: |
          $sentinels = @(
            'components/Packages/msys/mingw64/bin/verilator_bin.exe',
            'components/bin/cppcomp.exe',
            'components/Packages/gtkwave-nipscern/gtkwave.exe',
            'components/Packages/surfer/surfer.exe'
          )
          $missing = $sentinels | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Error "Bootstrap left toolchain sentinels missing:`n  $($missing -join "`n  ")"
            exit 1
          }
          Write-Host "All toolchain sentinels present."

      - name: Build main/preload (tsc)
        # electron-builder runs directly below (not via `npm run build`), so the
        # `prebuild` hook (bootstrap && build:ts && build:renderer) does NOT fire.
        # Compile the in-place .ts -> .js so a release cut from a commit whose .js
        # is out of sync with its .ts still ships fresh main/preload logic.
        run: npm run build:ts

      - name: Build renderer (Vite)
        # Bundles the renderer into dist/. Same reason as above — without this the
        # package would ship a stale/absent dist and fall back to the raw
        # index.html inside the asar.
        run: npm run build:renderer

      # NOTE: the installer is currently unsigned (SmartScreen warns on first
      # run). See docs/CODE_SIGNING.md to enable it — SignPath (free for OSS)
      # or Azure Trusted Signing (set CSC_LINK/CSC_KEY_PASSWORD as env here and
      # electron-builder signs the NSIS target inline).
      - name: Build & publish
        run: npx electron-builder --win --x64 --publish always
        env:
          # electron-builder uses GH_TOKEN to create the release + upload assets
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
