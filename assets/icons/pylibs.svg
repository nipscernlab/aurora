<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Bibliotecas Python">
  <!--
    Folha de simbolos das bibliotecas Python do painel da AURORA.

    Por que um sprite local: o renderer roda sob CSP estrita e nao busca imagem
    de host externo. Cada simbolo e desenhado aqui, referenciado por
    <use href="assets/icons/pylibs.svg#pylib-plotly"> e colorido pelo CSS via
    currentColor onde faz sentido.

    As marcas oficiais (Python, NumPy, SciPy, Plotly...) sao reproduzidas de
    forma simplificada e monocromatica apenas para IDENTIFICAR cada projeto na
    lista, que e uso nominativo, o mesmo que qualquer gerenciador de pacotes faz.
  -->
  <defs>

    <!-- Python: as duas cobras entrelacadas, reduzidas a dois corpos em L. -->
    <symbol id="pylib-python" viewBox="0 0 32 32">
      <path fill="currentColor" d="M15.9 2c-2.4 0-4.3.3-5.6.9-1.2.5-1.8 1.5-1.8 2.9v2.4h7.6v1H5.7c-1.5 0-2.7.9-3.3 2.5-.7 1.8-.7 3.6 0 5.5.6 1.6 1.6 2.5 3.1 2.5h2.3v-2.9c0-1.7 1.5-3.2 3.4-3.2h6.1c1.4 0 2.5-1.2 2.5-2.6V5.8c0-1.4-1.1-2.5-2.5-2.7-1-.2-2-.3-3.4-.3zm-3.4 2.3c.5 0 .9.4.9.9s-.4.9-.9.9-.9-.4-.9-.9.4-.9.9-.9z"/>
      <path fill="currentColor" opacity=".6" d="M16.1 30c2.4 0 4.3-.3 5.6-.9 1.2-.5 1.8-1.5 1.8-2.9v-2.4h-7.6v-1h10.4c1.5 0 2.7-.9 3.3-2.5.7-1.8.7-3.6 0-5.5-.6-1.6-1.6-2.5-3.1-2.5h-2.3v2.9c0 1.7-1.5 3.2-3.4 3.2h-6.1c-1.4 0-2.5 1.2-2.5 2.6v4.2c0 1.4 1.1 2.5 2.5 2.7 1 .2 2 .3 3.4.3zm3.4-2.3c-.5 0-.9-.4-.9-.9s.4-.9.9-.9.9.4.9.9-.4.9-.9.9z"/>
    </symbol>

    <!-- Plotly: barras de um grafico com a linha por cima. -->
    <symbol id="pylib-plotly" viewBox="0 0 32 32">
      <rect x="4"  y="18" width="4" height="10" rx="1" fill="currentColor" opacity=".45"/>
      <rect x="11" y="13" width="4" height="15" rx="1" fill="currentColor" opacity=".65"/>
      <rect x="18" y="20" width="4" height="8"  rx="1" fill="currentColor" opacity=".45"/>
      <rect x="25" y="8"  width="4" height="20" rx="1" fill="currentColor" opacity=".85"/>
      <path d="M5 16 L13 9 L20 15 L27 5" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Matplotlib: o disco polar com os raios. -->
    <symbol id="pylib-matplotlib" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".5"/>
      <circle cx="16" cy="16" r="7"  fill="none" stroke="currentColor" stroke-width="1.5" opacity=".35"/>
      <path d="M16 4v24M4 16h24M7.5 7.5l17 17M24.5 7.5l-17 17" stroke="currentColor"
            stroke-width="1" opacity=".3"/>
      <path d="M16 16 L26 12 A11 11 0 0 0 21 6 Z" fill="currentColor" opacity=".8"/>
    </symbol>

    <!-- NumPy: o cubo de dados em perspectiva. -->
    <symbol id="pylib-numpy" viewBox="0 0 32 32">
      <path d="M16 3 L28 9.5 L28 22.5 L16 29 L4 22.5 L4 9.5 Z" fill="none"
            stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M4 9.5 L16 16 L28 9.5 M16 16 L16 29" fill="none" stroke="currentColor"
            stroke-width="1.5" opacity=".55"/>
      <path d="M16 3 L28 9.5 L16 16 L4 9.5 Z" fill="currentColor" opacity=".22"/>
    </symbol>

    <!-- SciPy: a curva de sinal amortecida. -->
    <symbol id="pylib-scipy" viewBox="0 0 32 32">
      <path d="M3 16 Q6 4 9 16 T15 16 T21 16 T27 16" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round"/>
      <path d="M3 16 Q6 9 9 16 T15 16" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" opacity=".45"/>
      <circle cx="27" cy="16" r="2.2" fill="currentColor"/>
    </symbol>

    <!-- pandas: as colunas da tabela. -->
    <symbol id="pylib-pandas" viewBox="0 0 32 32">
      <rect x="6"  y="4" width="4.5" height="24" rx="1.5" fill="currentColor" opacity=".35"/>
      <rect x="13.7" y="4" width="4.5" height="24" rx="1.5" fill="currentColor" opacity=".9"/>
      <rect x="21.4" y="4" width="4.5" height="24" rx="1.5" fill="currentColor" opacity=".35"/>
      <rect x="13.7" y="10" width="4.5" height="5" rx="1" fill="var(--surface-overlay, #101318)"/>
      <rect x="13.7" y="19" width="4.5" height="5" rx="1" fill="var(--surface-overlay, #101318)"/>
    </symbol>

    <!-- SymPy: a integral, simbolo do calculo exato. -->
    <symbol id="pylib-sympy" viewBox="0 0 32 32">
      <path d="M20 6.5c-1.6-2-4.6-1.6-5.2 1.2-.5 2.4-.4 5.6-1 9.6-.7 4.8-1.3 7.4-2.6 8.6-1.4 1.4-3.5.9-4.2-.9"
            fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M9 13h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".5"/>
      <path d="M9 19h14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" opacity=".5"/>
    </symbol>

    <!-- mpmath: digitos de precisao arbitraria saindo do ponto decimal. -->
    <symbol id="pylib-mpmath" viewBox="0 0 32 32">
      <circle cx="7" cy="22" r="2.4" fill="currentColor"/>
      <path d="M12 22h4M18 22h3.5M23.5 22h2.5M27.5 22h1.5" stroke="currentColor"
            stroke-width="2.4" stroke-linecap="round" opacity=".75"/>
      <path d="M4 9h6M13 9h4M20 9h3" stroke="currentColor" stroke-width="2.4"
            stroke-linecap="round" opacity=".35"/>
      <path d="M4 15.5h9M16 15.5h5M24 15.5h4" stroke="currentColor" stroke-width="2.4"
            stroke-linecap="round" opacity=".55"/>
    </symbol>

    <!-- pytest / testes: o visto dentro do circulo. -->
    <symbol id="pylib-pytest" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="12.5" fill="none" stroke="currentColor" stroke-width="2" opacity=".55"/>
      <path d="M10 16.5 L14.2 20.5 L22 12" fill="none" stroke="currentColor" stroke-width="2.6"
            stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>

    <!-- Rich / terminal: o prompt. -->
    <symbol id="pylib-rich" viewBox="0 0 32 32">
      <rect x="3" y="6" width="26" height="20" rx="3" fill="none" stroke="currentColor"
            stroke-width="2" opacity=".6"/>
      <path d="M8.5 13 L12.5 16.5 L8.5 20" fill="none" stroke="currentColor" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M15.5 20.5h8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
    </symbol>

    <!-- Tabulate: a grade. -->
    <symbol id="pylib-tabulate" viewBox="0 0 32 32">
      <rect x="4" y="6" width="24" height="20" rx="2.5" fill="none" stroke="currentColor"
            stroke-width="2" opacity=".6"/>
      <path d="M4 12.5h24M4 19.5h24M12 6v20M20 6v20" stroke="currentColor" stroke-width="1.5" opacity=".45"/>
      <rect x="4" y="6" width="24" height="6.5" rx="2.5" fill="currentColor" opacity=".25"/>
    </symbol>

    <!-- cocotb: a corrotina que abraca o dado. -->
    <symbol id="pylib-cocotb" viewBox="0 0 32 32">
      <path d="M23 8.5a10 10 0 1 0 2.6 9" fill="none" stroke="currentColor" stroke-width="2.4"
            stroke-linecap="round"/>
      <circle cx="16" cy="16" r="3.6" fill="currentColor"/>
      <circle cx="25.2" cy="7.4" r="2.4" fill="currentColor" opacity=".6"/>
    </symbol>

    <!-- pyUVM: as camadas do ambiente de verificacao. -->
    <symbol id="pylib-pyuvm" viewBox="0 0 32 32">
      <path d="M16 3 L28 9 L16 15 L4 9 Z" fill="currentColor" opacity=".85"/>
      <path d="M4 15.5 L16 21.5 L28 15.5" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linejoin="round" opacity=".55"/>
      <path d="M4 22 L16 28 L28 22" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linejoin="round" opacity=".3"/>
    </symbol>

    <!-- VCD: a forma de onda digital. -->
    <symbol id="pylib-vcd" viewBox="0 0 32 32">
      <path d="M3 21 L8 21 L8 11 L14 11 L14 21 L20 21 L20 11 L26 11 L26 21 L29 21"
            fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"
            stroke-linejoin="round"/>
      <path d="M3 26h26" stroke="currentColor" stroke-width="1.2" opacity=".3"/>
      <path d="M3 6h26" stroke="currentColor" stroke-width="1.2" opacity=".3"/>
    </symbol>

    <!-- Fallback: um pacote generico, para id de icone que ainda nao existe. -->
    <symbol id="pylib-generic" viewBox="0 0 32 32">
      <path d="M16 3 L28 9.5 L28 22.5 L16 29 L4 22.5 L4 9.5 Z" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M4 9.5 L16 16 L28 9.5 M16 16 L16 29" fill="none" stroke="currentColor"
            stroke-width="1.6" opacity=".5"/>
    </symbol>

  </defs>

  <!-- Vista padrao do arquivo (quando aberto direto): o simbolo do Python. -->
  <use href="#pylib-python" width="256" height="256" color="#6f9dd8"/>
</svg>
