<?xml version="1.0" encoding="UTF-8"?>
<!--
  PRISM custom skin: Comparators
  Covers: eq, ne, lt, le, gt, ge ($eq, $ne, $lt, $le, $gt, $ge, $eqx, $nex)
  Each block has the same body but a different glyph (=, ≠, <, ≤, >, ≥).
  Ports: A, B (inputs), Y (output)

  Visual: rounded rectangle (hex-ish) with the comparison glyph.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:s="https://github.com/nturley/netlistsvg">

  <g s:type="eq" transform="translate(0, 0)" s:width="25" s:height="25">
    <s:alias val="$eq"/>
    <s:alias val="$eqx"/>
    <path d="M 3,0 L 22,0 L 25,12.5 L 22,25 L 3,25 L 0,12.5 Z"
          class="$cell_id"
          style="fill: var(--prism-module-fill, rgba(95,224,176,0.15));" />
    <text x="12.5" y="17" class="nodelabel $cell_id" s:attribute=""
          style="text-anchor: middle; font-weight: 800; font-size: 12px;
                 fill: var(--text, #ffffff);">=</text>
    <g s:x="0"  s:y="6"    s:pid="A"/>
    <g s:x="0"  s:y="19"   s:pid="B"/>
    <g s:x="25" s:y="12.5" s:pid="Y"/>
  </g>

  <g s:type="ne" transform="translate(0, 0)" s:width="25" s:height="25">
    <s:alias val="$ne"/>
    <s:alias val="$nex"/>
    <path d="M 3,0 L 22,0 L 25,12.5 L 22,25 L 3,25 L 0,12.5 Z"
          class="$cell_id"
          style="fill: var(--prism-module-fill, rgba(95,224,176,0.15));" />
    <text x="12.5" y="17" class="nodelabel $cell_id" s:attribute=""
          style="text-anchor: middle; font-weight: 800; font-size: 12px;
                 fill: var(--text, #ffffff);">≠</text>
    <g s:x="0"  s:y="6"    s:pid="A"/>
    <g s:x="0"  s:y="19"   s:pid="B"/>
    <g s:x="25" s:y="12.5" s:pid="Y"/>
  </g>

  <g s:type="lt" transform="translate(0, 0)" s:width="25" s:height="25">
    <s:alias val="$lt"/>
    <path d="M 3,0 L 22,0 L 25,12.5 L 22,25 L 3,25 L 0,12.5 Z"
          class="$cell_id"
          style="fill: var(--prism-module-fill, rgba(95,224,176,0.15));" />
    <text x="12.5" y="17" class="nodelabel $cell_id" s:attribute=""
          style="text-anchor: middle; font-weight: 800; font-size: 12px;
                 fill: var(--text, #ffffff);">&lt;</text>
    <g s:x="0"  s:y="6"    s:pid="A"/>
    <g s:x="0"  s:y="19"   s:pid="B"/>
    <g s:x="25" s:y="12.5" s:pid="Y"/>
  </g>

  <g s:type="le" transform="translate(0, 0)" s:width="25" s:height="25">
    <s:alias val="$le"/>
    <path d="M 3,0 L 22,0 L 25,12.5 L 22,25 L 3,25 L 0,12.5 Z"
          class="$cell_id"
          style="fill: var(--prism-module-fill, rgba(95,224,176,0.15));" />
    <text x="12.5" y="17" class="nodelabel $cell_id" s:attribute=""
          style="text-anchor: middle; font-weight: 800; font-size: 12px;
                 fill: var(--text, #ffffff);">≤</text>
    <g s:x="0"  s:y="6"    s:pid="A"/>
    <g s:x="0"  s:y="19"   s:pid="B"/>
    <g s:x="25" s:y="12.5" s:pid="Y"/>
  </g>

  <g s:type="gt" transform="translate(0, 0)" s:width="25" s:height="25">
    <s:alias val="$gt"/>
    <path d="M 3,0 L 22,0 L 25,12.5 L 22,25 L 3,25 L 0,12.5 Z"
          class="$cell_id"
          style="fill: var(--prism-module-fill, rgba(95,224,176,0.15));" />
    <text x="12.5" y="17" class="nodelabel $cell_id" s:attribute=""
          style="text-anchor: middle; font-weight: 800; font-size: 12px;
                 fill: var(--text, #ffffff);">&gt;</text>
    <g s:x="0"  s:y="6"    s:pid="A"/>
    <g s:x="0"  s:y="19"   s:pid="B"/>
    <g s:x="25" s:y="12.5" s:pid="Y"/>
  </g>

  <g s:type="ge" transform="translate(0, 0)" s:width="25" s:height="25">
    <s:alias val="$ge"/>
    <path d="M 3,0 L 22,0 L 25,12.5 L 22,25 L 3,25 L 0,12.5 Z"
          class="$cell_id"
          style="fill: var(--prism-module-fill, rgba(95,224,176,0.15));" />
    <text x="12.5" y="17" class="nodelabel $cell_id" s:attribute=""
          style="text-anchor: middle; font-weight: 800; font-size: 12px;
                 fill: var(--text, #ffffff);">≥</text>
    <g s:x="0"  s:y="6"    s:pid="A"/>
    <g s:x="0"  s:y="19"   s:pid="B"/>
    <g s:x="25" s:y="12.5" s:pid="Y"/>
  </g>

</svg>
