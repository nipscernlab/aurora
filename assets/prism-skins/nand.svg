<?xml version="1.0" encoding="UTF-8"?>
<!--
  PRISM custom skin: NAND gate
  Covers: $nand, $logic_nand, $_NAND_
  Ports: A, B (inputs), Y (output)

  Visual: AND D-shape + inversion bubble at output.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:s="https://github.com/nturley/netlistsvg">

  <g s:type="nand" transform="translate(0, 0)" s:width="38" s:height="25">
    <s:alias val="$nand"/>
    <s:alias val="$logic_nand"/>
    <s:alias val="$_NAND_"/>

    <!-- D-shape -->
    <path d="M 0,0 L 0,25 L 17,25 A 12.5 12.5 0 0 0 17,0 Z"
          class="$cell_id"
          style="fill: var(--prism-module-fill, rgba(95,224,176,0.15));" />

    <!-- Inversion bubble -->
    <circle cx="33" cy="12.5" r="2.5"
            class="$cell_id"
            style="fill: var(--bg, #0A0D14);
                   stroke: var(--prism-module-stroke, #5FE0B0);
                   stroke-width: 1;" />

    <!-- Glyph -->
    <text x="11" y="16"
          class="nodelabel $cell_id" s:attribute=""
          style="text-anchor: middle; font-weight: 700; font-size: 10px;
                 fill: var(--text, #ffffff); opacity: 0.7;">&amp;</text>

    <!-- Port anchors -->
    <g s:x="0"  s:y="6"    s:pid="A"/>
    <g s:x="0"  s:y="19"   s:pid="B"/>
    <g s:x="36" s:y="12.5" s:pid="Y"/>
  </g>

</svg>
