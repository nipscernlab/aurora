name: Bug report
description: Report a problem with AURORA so we can fix it.
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill out the
        sections below — the more concrete the report, the faster we can
        reproduce it.

  - type: input
    id: aurora-version
    attributes:
      label: AURORA version
      description: From `Help ▸ About` or `package.json#version`.
      placeholder: "6.1.3"
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: "Windows 11 Home 23H2 (build 22631)"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open project X
        2. Click the pen icon
        3. Observe …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: terminal
    attributes:
      label: Relevant terminal output (TCMM / TASM / TVERI / TWAVE)
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / screen recordings (optional)
