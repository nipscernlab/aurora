<?xml version="1.0"?><svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="SAPHO" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>SAPHO — versao para tamanhos pequenos</title>
  <desc>Olho de camaleao em escamas: celulas de Voronoi sobre uma espiral de filotaxia no angulo aureo, com a orla recortada por um raio-limite que varia com o angulo, de modo que a silhueta nao fecha em circulo. Cor da aurora boreal, verde no miolo passando por ciano e azul ate o violeta. Fundo transparente; funciona em fundo claro e escuro. Versao reduzida para 16 e 20 px.</desc>
