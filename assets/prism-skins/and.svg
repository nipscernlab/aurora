<?xml version="1.0" encoding="UTF-8"?>
<!--
  PRISM custom skin: AND gate (and family)
  Covers: $and, $logic_and, $_AND_, $reduce_and
  Ports: A (input), B (input), Y (output)

  Visual: classic D-shape (flat back, half-circle front).
-->
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:s="https://github.com/nturley/netlistsvg">

  <g s:type="and" transform="translate(0, 0)" s:width="35" s:height="25">
    <s:alias val="$and"/>
    <s:alias val="$logic_and"/>
    <s:alias val="$_AND_"/>
    <s:alias val="$reduce_and"/>

    <!-- D-shape body -->
    <path d="M 0,0 L 0,25 L 17,25 A 12.5 12.5 0 0 0 17,0 Z"
          class="$cell_id"
          style="fill: var(--prism-module-fill, rgba(95,224,176,0.15));" />

    <!-- Operator glyph inside body -->
    <text x="11" y="16"
          class="nodelabel $cell_id" s:attribute=""
          style="text-anchor: middle; font-weight: 700; font-size: 10px;
                 fill: var(--text, #ffffff); opacity: 0.7;">&amp;</text>

    <!-- Port anchors -->
    <g s:x="0"  s:y="6"    s:pid="A"/>
    <g s:x="0"  s:y="19"   s:pid="B"/>
    <g s:x="30" s:y="12.5" s:pid="Y"/>
  </g>

</svg>
