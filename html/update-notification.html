<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Available</title>
  <!-- Title is also rewritten by the inline locale script below -->

  <style>
    /* General styles for the body */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.4);
    }

    /* Styles for the notification container */
    .notification-container {
      background-color: #fff;
      padding: 20px;
      width: 400px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      text-align: center;
    }

    /* Header text styling */
    .notification-header {
      font-size: 18px;
      color: #333;
      font-weight: bold;
    }

    /* Message text styling */
    .notification-message {
      margin: 10px 0 20px;
      color: #555;
    }

    /* Alert section styling */
    .notification-alert {
      border-top: 3px solid #ff5555;
      padding-top: 10px;
      margin-bottom: 15px;
      color: #333;
    }

    /* Button container styling */
    .notification-buttons {
      display: flex;
      justify-content: space-around;
    }

    /* Button styling */
    .notification-buttons button {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      background-color: #007bff;
      color: #fff;
    }

    /* Cancel button specific styling */
    .notification-buttons button.cancel {
      background-color: #aaa;
    }

    /* Progress bar container styling */
    .progress-bar {
      margin-top: 20px;
      background-color: #e0e0e0;
      border-radius: 4px;
      height: 10px;
      overflow: hidden;
      width: 100%;
    }

    /* Progress bar fill styling */
    .progress-bar div {
      height: 100%;
      width: 0;
      background-color: #007bff;
      transition: width 0.3s;
    }

    /* Success message styling */
    .success-message {
      color: green;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <!-- Notification container -->
  <div class="notification-container">
    <!-- Header for the notification -->
    <div class="notification-header" id="t-header">Update Available</div>
    <!-- Alert message for the user -->
    <div class="notification-alert" id="t-alert">New version available. Do you want to download it now?</div>
    <!-- Buttons for user response -->
    <div class="notification-buttons">
      <button id="t-yes" onclick="handleUserResponse(true)">Yes</button>
      <button id="t-no" class="cancel" onclick="handleUserResponse(false)">No</button>
    </div>
    <!-- Progress section, initially hidden -->
    <div id="progress-section" style="display: none;">
      <div class="notification-message" id="t-downloading">Downloading update...</div>
      <div class="progress-bar"><div id="progress-bar-fill"></div></div>
    </div>
    <!-- Success message, initially hidden -->
    <div id="success-message" class="success-message" style="display: none;">
      <span id="t-success">Update downloaded successfully. Restart to install.</span>
    </div>
    <!-- Buttons for restarting or postponing, initially hidden -->
    <div class="notification-buttons" id="reload-section" style="display: none;">
      <button id="t-restart" onclick="handleInstall()">Restart Now</button>
      <button id="t-later" class="cancel" onclick="closeNotification()">Later</button>
    </div>
  </div>
  <script>
    // Locale-aware copy (independent window — no access to the main
    // i18n layer). Same pattern as splash.html: tiny inline string
    // table, reads `aurora-locale` from localStorage directly.
    (function () {
      const STRINGS = {
        en: {
          title:       'Update Available',
          alert:       'New version available. Do you want to download it now?',
          yes:         'Yes',
          no:          'No',
          downloading: 'Downloading update...',
          success:     'Update downloaded successfully. Restart to install.',
          restart:     'Restart Now',
          later:       'Later',
        },
        pt: {
          title:       'Atualização Disponível',
          alert:       'Nova versão disponível. Deseja baixar agora?',
          yes:         'Sim',
          no:          'Não',
          downloading: 'Baixando atualização...',
          success:     'Atualização baixada com sucesso. Reinicie para instalar.',
          restart:     'Reiniciar Agora',
          later:       'Depois',
        },
      };
      const locale = (() => {
        try {
          const v = localStorage.getItem('aurora-locale');
          if (v === 'en' || v === 'pt') return v;
          const legacy = localStorage.getItem('aurora-yanc-lang');
          if (legacy === 'en' || legacy === 'pt') return legacy;
        } catch (_) {}
        return 'pt';
      })();
      const T = STRINGS[locale] || STRINGS.pt;
      document.title = T.title;
      document.getElementById('t-header').textContent      = T.title;
      document.getElementById('t-alert').textContent       = T.alert;
      document.getElementById('t-yes').textContent         = T.yes;
      document.getElementById('t-no').textContent          = T.no;
      document.getElementById('t-downloading').textContent = T.downloading;
      document.getElementById('t-success').textContent     = T.success;
      document.getElementById('t-restart').textContent     = T.restart;
      document.getElementById('t-later').textContent       = T.later;
    })();
  </script>
  <!-- External JavaScript file -->
  <script src="../js/app/renderer.js"></script>
</body>
</html>
