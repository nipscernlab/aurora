name: Release

# Builds the Windows installer and publishes it to a GitHub Release.
# The auto-updater (electron-updater) reads `latest.yml` + the .exe directly
# from these release assets — see `main/updater.js`.
#
# Trigger: `workflow_dispatch` (manual) for now. The build needs the bundled
# SAPHO toolchain under `components/`, which is NOT committed to the source
# tree — `npm run bootstrap` downloads it: the unified mingw bundle
# (iverilog/yosys/verilator/python+cocotb) from the `msys-vN` Release, plus the
# gtkwave-nipscern fork and the YANC compilers from their own Releases.
# netlistsvg rides in via `npm ci` (@silimate/netlistsvg, in-process).
#
# To cut a release:
#   1. `npm version patch` (or minor / major) — generates a tagged commit.
#   2. `git push --follow-tags`.
#   3. Open the Actions tab → "Release" workflow → "Run workflow".

on:
  workflow_dispatch:

jobs:
  release:
    name: Build & publish (windows-latest)
    runs-on: windows-latest

    permissions:
      contents: write   # needed to create the GitHub Release

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Bootstrap toolchain bundle
        # Downloads the unified msys bundle + gtkwave-nipscern + YANC compilers
        # and copies components into place. Pulls from public Releases (no token).
        run: npm run bootstrap

      - name: Build & publish
        run: npx electron-builder --win --x64 --publish always
        env:
          # electron-builder uses GH_TOKEN to create the release + upload assets
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
