name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint + smoke build (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned dependency versions
        run: node scripts/check-pinned-versions.js

      - name: ESLint
        run: npx eslint . --max-warnings=0

      - name: TypeScript check (// @ts-check'd files only)
        run: npm run typecheck

      - name: Sanity check JS modules
        shell: pwsh
        run: |
          Get-ChildItem -Path js,main -Recurse -Filter *.js |
            ForEach-Object { node --check $_.FullName }

      - name: Unit tests
        run: npm test

      - name: E2E tests (Electron smoke)
        run: npm run test:e2e

      - name: Build (no publish)
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
