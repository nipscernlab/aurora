name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint + smoke build (windows-latest)
    runs-on: windows-latest

    steps:
      # Historico inteiro, e nao so o ultimo commit: o passo de cobertura das
      # linhas alteradas faz `git diff` contra o commit de antes do push, ou
      # contra a base do pull request, e num clone raso esse commit nao existe.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Node 22, nao 20: o piso real do projeto e 22.22.1, imposto pelo
      # lint-staged 17. Antes disso o electron 43 pede 22.12, o commitlint 21
      # pede 22.12 e o claude-code pede 22. Rodar em 20 deixava o `npm ci`
      # cuspindo EBADENGINE em quatro pacotes e testava numa versao que o
      # projeto nao suporta. O piso esta declarado em package.json engines.
      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Compilar ANTES de qualquer conferencia, e nao dentro de uma delas.
      #
      # Os .ts do repositorio viram .js ao lado, e esses .js sao gerados e
      # ficam fora do git. Uma copia limpa, que e o que o runner tem, nao os
      # possui ate este passo rodar, entao toda conferencia que carregue um
      # modulo depende dele.
      #
      # Ja custou caro duas vezes, e as duas apareceram juntas: o gerador da
      # referencia das ferramentas morria no `require` de
      # js/compilation/api_steps.js, e o knip acusava `digitaljs`, `jquery` e
      # `jquery-ui` como dependencias sem uso, porque quem as importa e o
      # html/prism/prism.js, que tambem so existe depois de compilar. Nenhuma
      # das duas aparece na maquina de quem desenvolve, onde os .js gerados
      # estao sempre la.
      #
      # Como passo proprio e no comeco, a ordem dos passos seguintes deixa de
      # importar: nenhum deles pode rodar antes da compilacao.
      - name: Build TypeScript (os .js gerados que o resto dos passos carrega)
        run: npm run build:ts

      - name: Verify pinned dependency versions
        run: node scripts/check-pinned-versions.js

      - name: ESLint
        run: npx eslint . --max-warnings=0

      # Catraca de tipos. O tsconfig.json enxerga todo .js com `// @ts-check`
      # (main/, scripts, PRISM) em strict, e sao 961 erros hoje, quase todos
      # JSDoc que falta. Cada arquivo carrega em scripts/types-baseline.json o
      # numero que tem, e o que quebra e passar dele. A lista inteira continua
      # em `npx tsc --noEmit`.
      - name: Typecheck (catraca de tipos)
        run: node scripts/check-types.js

      - name: No generated .js committed (B4/B5 guard)
        run: node scripts/check-no-generated-js.js

      - name: i18n consistency (en/pt sync + no undefined keys)
        run: node scripts/check-i18n.js

      # A referencia das ferramentas da IA e gerada do TOOL_MANIFEST. Escrita a
      # mao, ela chegou a documentar 49 das 103, faltando funcionalidades
      # inteiras. Este check falha quando alguem acrescenta ou muda uma
      # ferramenta sem regerar.
      - name: AI tools reference is up to date
        run: node scripts/gen-ai-tools-doc.js --check

      - name: Dead code (unused files + dependencies)
        run: npm run deadcode

      # Catraca de desenho. Nao exige limpar as 163 cores e 172 duracoes
      # cravadas que existem hoje; exige apenas que o numero nao suba. Foi uma
      # regra de cada vez que as tres janelas terminaram com tres ceus noturnos
      # diferentes, e limpar tudo de uma vez para so entao ligar o check e como
      # nunca ligar.
      - name: Design tokens (no new hardcoded colours or durations)
        run: node scripts/check-design-tokens.js

      # Catraca de globais. O que um arquivo poe em `window` e outro le de la
      # e dependencia que o grafo de import nao mostra e o TypeScript ve como
      # `any`. Nao exige tirar as 45 de hoje; exige que nenhuma nova nasca.
      - name: Window globals (no new cross-file globals)
        run: node scripts/check-window-globals.mts

      - name: Sanity check JS modules
        shell: pwsh
        run: |
          Get-ChildItem -Path js,main -Recurse -Filter *.js |
            ForEach-Object { node --check $_.FullName }

      # O manual do SAPHO, so ele, antes dos testes. A tabela de ajuda dos
      # modais (js/ui/help_link.js) e conferida contra esta copia: pagina e
      # ancora, uma por uma. Sem este passo o teste se abstem, porque
      # resources/docs e gitignorado e vem do bootstrap, e a conferencia que
      # mais importa e justamente a da CI, onde ninguem esta olhando.
      #
      # Nao e o `npm run bootstrap` inteiro: aquilo baixa a toolchain de
      # centenas de MB, que este job nao usa. O script sai com 0 em qualquer
      # falha de rede, de proposito, e nesse caso o teste avisa que se absteve
      # em vez de derrubar a CI por um servidor fora do ar.
      - name: Manual do SAPHO (para a conferencia da tabela de ajuda)
        run: node components/Scripts/download-docs.js

      - name: Unit tests (with coverage)
        run: npm run test:coverage

      # Toda linha de codigo que a mudanca toca tem de estar exercitada por um
      # teste unitario (CONTRIBUTING.md, "Changing a file"). A cobertura geral
      # continua informativa, no Codecov logo abaixo; o que trava e so a linha
      # alterada sem teste. No push a base e o commit de antes dele, no pull
      # request e a base do PR.
      - name: Changed lines are covered by tests
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run coverage:diff

      - name: Upload coverage to Codecov
        # Uses the repo's CODECOV_TOKEN secret (GitHub → Settings → Secrets and
        # variables → Actions). Never fails CI, coverage is informational here.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false


      - name: E2E tests (Electron smoke)
        run: npm run test:e2e

      - name: Build renderer (Vite)
        # electron-builder is invoked directly below (not via `npm run build`), so
        # the `prebuild` hook does NOT fire. Build the renderer explicitly so the
        # packaged smoke build validates the real Vite output (dist/) instead of a
        # stale/absent dist silently falling back to the raw index.html in the asar.
        run: npm run build:renderer

      - name: Build (no publish)
        run: npx electron-builder --win --x64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
