<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAPHO &amp; AURORA — Manual</title>
  <!-- Fontes locais e paleta da marca (offline, fonte única). -->
  <link rel="stylesheet" href="../css/base/fonts.css">
  <link rel="stylesheet" href="../css/base/brand_tokens.css">
  <style>
    :root {
      --bg-0:      #060A14;
      --bg-1:      #0C1322;
      --bg-2:      #121C30;
      --text:      #EAF0F8;
      --text-soft: #9AA6BC;
      --text-dim:  #5E6A80;
      --border:    rgba(255,255,255,0.09);
      --teal:      var(--aurora-mint);
      --danger:    #E0574F;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg-0);
      color: var(--text);
      font-family: var(--font-sans), system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* A barra ocupa só o topo: o resto da janela pertence ao WebContentsView
       com o manual, posicionado pelo main. Manter os 44px em sincronia com
       CHROME_H de main/ipc/docs_window.js. */
    .topbar {
      -webkit-app-region: drag;
      height: 44px;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px 0 12px;
      background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex; align-items: center; gap: 8px;
      font-size: 12px; font-weight: 700; letter-spacing: 0.08em;
      flex-shrink: 0;
    }
    .brand img { width: 19px; height: 19px; }
    .brand .amp    { color: var(--text-dim); font-weight: 500; }
    .brand .aurora { color: var(--text-soft); font-weight: 600; }

    .sep {
      width: 1px; height: 18px; flex-shrink: 0;
      background: var(--border); margin: 0 4px;
    }

    button {
      -webkit-app-region: no-drag;
      width: 28px; height: 28px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: transparent; border: 1px solid transparent; border-radius: 7px;
      color: var(--text-soft); cursor: pointer;
      transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
    }
    button:hover:not(:disabled) {
      background: var(--bg-2); border-color: var(--border); color: var(--text);
    }
    button:disabled { opacity: 0.28; cursor: default; }
    button svg { width: 15px; height: 15px; }

    /* O título do capítulo atual, no meio, sem roubar a área de arrastar. */
    .title {
      flex: 1; min-width: 0;
      text-align: center;
      font-size: 11.5px; color: var(--text-dim);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding: 0 10px;
    }

    .win-controls { display: flex; gap: 2px; flex-shrink: 0; }
    .win-controls .close:hover {
      background: var(--danger); border-color: var(--danger); color: #fff;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <img src="../assets/icons/sapho_aurora_icon.svg" alt="">
      <span>SAPHO</span><span class="amp">&amp;</span><span class="aurora">AURORA</span>
    </div>

    <div class="sep"></div>

    <button id="back" title="Voltar" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button id="forward" title="Avançar" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <button id="reload" title="Recarregar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button id="home" title="Início do manual">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    </button>

    <div class="title" id="title">Manual</div>

    <div class="win-controls">
      <button id="min" title="Minimizar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <button id="max" title="Maximizar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linejoin="round"><rect x="5" y="5" width="14" height="14" rx="2"/></svg>
      </button>
      <button id="close" class="close" title="Fechar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
             stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>

  <script src="./docs-browser-ui.js" type="module"></script>
</body>
</html>
