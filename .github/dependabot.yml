# Weekly dependency scans for npm + GitHub Actions.
# Groups dev-only updates so the PR feed stays manageable; runtime deps
# (electron, electron-updater, monaco-editor, etc.) still come through as
# individual PRs since each carries real risk.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "deps"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      # O Vercel AI SDK so funciona com a familia inteira na mesma geracao.
      # O nucleo `ai` fixa a versao da interface @ai-sdk/provider (ai 6 fala
      # a 3.x, ai 7 fala a 4.x) e cada provedor e compilado contra uma delas.
      # Subir um provedor sozinho instala duas copias da interface e entrega
      # ao nucleo um modelo que ele nao sabe consumir — quebra em execucao,
      # nao em build, e o CI nao pega porque nao existe teste com provedor
      # real (ver docs/PENDENCIAS.md §4).
      #
      # Aconteceu: os PRs #50, #41 e #43 subiam anthropic, openai e deepseek
      # para a interface 4 com o `ai` ainda em 6. Agrupados, viram um PR so,
      # que e a unica forma correta de fazer essa migracao.
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/*"
    ignore:
      # monaco-editor esta pinado em 0.52.2 no package.json por um motivo
      # concreto: a 0.53.0 lanca excecao dentro do proprio
      # monaco.contribution.js durante a init, travando
      # EditorManager.initialize() e deixando o editor pela metade (cursor
      # aparece, digitacao morre). O historico esta em
      # scripts/check-pinned-versions.js.
      #
      # Aquele guarda NAO cobre este caso. Ele compara o declarado no
      # package.json com o instalado em node_modules, e o Dependabot sobe os
      # dois juntos — a checagem passaria. Como 0.52 -> 0.55 e classificado
      # como minor, o auto-merge de patch/minor engoliria o bump sozinho e
      # quebraria o editor sem ninguem olhar. Por isso a barreira vive aqui,
      # no ponto onde o PR nem chega a nascer.
      #
      # Para destravar: subir manualmente, abrir o editor, digitar, e so
      # entao remover estas linhas junto com o pin no package.json.
      - dependency-name: "monaco-editor"

      # jQuery preso na 3.x pelo digitaljs, que e quem desenha a simulacao
      # interativa do PRISM. O digitaljs 0.14.2 declara `jquery: ^3.7.1`, entao
      # subir a raiz para a 4 faz o npm instalar duas copias, a 4 no topo e a 3
      # aninhada. O html/prism/prism.js importa jquery, publica em window.jQuery
      # e carrega o jquery-ui COMPLETO nesse global antes do digitaljs; com duas
      # instancias o digitaljs resolveria a sua propria jquery 3, sem jquery-ui
      # anexado, e voltaria o "e.widget is not a function" que o commit 52696d9c
      # corrigiu.
      #
      # O jquery-ui aceita ">=1.12.0 <5.0.0", ou seja, ele nao e o obstaculo. O
      # bloqueio e o digitaljs. Destravar quando ele publicar suporte a 4:
      # remover estas linhas, subir os dois juntos e abrir o modo Simular do
      # PRISM num design real. Patch e minor da 3.x continuam entrando.
      - dependency-name: "jquery"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "deps"
      - "ci"
